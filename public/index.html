function toggleAdvanced(id){
  const el = document.getElementById(id);
  if(!el) return;
  el.style.display = (el.style.display==='none' || !el.style.display) ? 'block' : 'none';
  if(id==='qc-advanced-panel' && el.style.display==='block') updateQuickAdvanced();
  if(id==='batch-advanced-panel' && el.style.display==='block') refreshCalcTotalsOnly();
}

function quickCalcItem(){
  return {
    length: document.getElementById('qc_length')?.value,
    lengthUnit: document.getElementById('qc_lengthUnit')?.value||'ft',
    width: document.getElementById('qc_width')?.value,
    widthUnit: document.getElementById('qc_widthUnit')?.value||'in',
    thickness: document.getElementById('qc_thickness')?.value,
    thicknessUnit: document.getElementById('qc_thicknessUnit')?.value||'in',
    qty: document.getElementById('qc_qty')?.value||1
  };
}
function dimsExtra(item){
  const {cft, cbm} = calcCFTCBM(item);
  const Lft = (parseFloat(item.length)||0)*UNIT_MM[item.lengthUnit]/304.8;
  const Wft = (parseFloat(item.width)||0)*UNIT_MM[item.widthUnit]/304.8;
  const Lm  = (parseFloat(item.length)||0)*UNIT_MM[item.lengthUnit]/1000;
  const qty = parseFloat(item.qty)||0;
  return {cft, cbm, boardFt:cft*12, sqFt:round3(Lft*Wft*qty), rft:round2(Lft*qty), rmt:round2(Lm*qty), qty};
}

function updateQuickCalc(){
  const item = quickCalcItem();
  const r = dimsExtra(item);
  const out = document.getElementById('qc-results');
  if(out){
    out.innerHTML = `
    <div class="grid g4" style="margin-top:14px;">
      <div class="stat"><div class="label">Total CFT</div><div class="value">${numFmt(r.cft,3)}</div></div>
      <div class="stat"><div class="label">Total CBM</div><div class="value">${numFmt(r.cbm,4)}</div></div>
      <div class="stat"><div class="label">Board Feet</div><div class="value">${numFmt(r.boardFt,2)}</div></div>
      <div class="stat"><div class="label">CFT / Piece</div><div class="value">${numFmt(r.qty>0?r.cft/r.qty:0,3)}</div></div>
    </div>
    <div class="grid g3" style="margin-top:12px;">
      <div class="stat"><div class="label">Running Ft (total length)</div><div class="value">${numFmt(r.rft,2)}</div></div>
      <div class="stat"><div class="label">Running Meter</div><div class="value">${numFmt(r.rmt,2)}</div></div>
      <div class="stat"><div class="label">Sq Ft (face area)</div><div class="value">${numFmt(r.sqFt,2)}</div></div>
    </div>`;
  }
  updateQuickAdvanced();
}
function fillQuickDensityFromWood(){
  const wood = v('qc_wood');
  const dField = document.getElementById('qc_density');
  if(wood && DB.settings.density && DB.settings.density[wood] && dField && !dField.value){
    dField.value = DB.settings.density[wood];
  }
  updateQuickCalc();
}
function updateQuickAdvanced(){
  const box = document.getElementById('qc-advanced-out');
  if(!box) return;
  const item = quickCalcItem();
  const r = dimsExtra(item);
  const wastage = parseFloat(document.getElementById('qc_wastage')?.value)||0;
  const density = parseFloat(document.getElementById('qc_density')?.value)||0;
  const rate = parseFloat(document.getElementById('qc_rate')?.value)||0;
  const rateType = document.getElementById('qc_rateType')?.value||'CFT';
  const netCft = round3(r.cft*(1-wastage/100));
  const weightKg = density>0 ? round2(r.cbm*density) : 0;
  let amount = 0;
  switch(rateType){
    case 'CFT': amount = r.cft*rate; break;
    case 'CBM': amount = r.cbm*rate; break;
    case 'PIECE': amount = r.qty*rate; break;
    case 'RFT': amount = r.rft*rate; break;
    case 'RMT': amount = r.rmt*rate; break;
    case 'SFT': amount = r.sqFt*rate; break;
    default: amount = r.cft*rate;
  }
  amount = round2(amount);
  box.innerHTML = `
    <div class="grid g3" style="margin-top:12px;">
      <div class="stat ${wastage>0?'neg':''}"><div class="label">Net Usable CFT after ${wastage||0}% Wastage</div><div class="value">${numFmt(netCft,3)}</div></div>
      <div class="stat"><div class="label">Est. Weight</div><div class="value">${weightKg>0?numFmt(weightKg,1)+' kg':'—'}</div></div>
      <div class="stat pos"><div class="label">Est. Value</div><div class="value">${amount>0?money(amount):'—'}</div></div>
    </div>`;
}

function calcRowHTML(item, idx){
  const {cft,cbm} = calcCFTCBM(item);
  return `
  <tr class="item-row" data-idx="${idx}">
    <td>${idx+1}</td>
    <td style="min-width:110px;"><input value="${esc(item.wood)}" placeholder="Teak" list="wood-list-calc" oninput="updCalcItem(${idx},'wood',this.value)"></td>
    <td><div class="dim-cell"><input type="number" step="0.01" value="${item.length}" oninput="updCalcItem(${idx},'length',this.value)">
      <select onchange="updCalcItem(${idx},'lengthUnit',this.value)">${unitOpts(item.lengthUnit)}</select></div></td>
    <td><div class="dim-cell"><input type="number" step="0.01" value="${item.width}" oninput="updCalcItem(${idx},'width',this.value)">
      <select onchange="updCalcItem(${idx},'widthUnit',this.value)">${unitOpts(item.widthUnit)}</select></div></td>
    <td><div class="dim-cell"><input type="number" step="0.01" value="${item.thickness}" oninput="updCalcItem(${idx},'thickness',this.value)">
      <select onchange="updCalcItem(${idx},'thicknessUnit',this.value)">${unitOpts(item.thicknessUnit)}</select></div></td>

    <td class="num mono">${numFmt(cbm,4)}</td>
    <td><button class="btn btn-sm btn-ghost btn-danger" onclick="removeCalcRow(${idx})">✕</button></td>

}
function renderCalcTable(){
  return `
  <div class="tbl-wrap">
  <table class="items-table" style="width:900px;">
    <thead><tr>
      <th style="width:30px;">#</th><th style="width:180px;">Wood</th>
      <th style="width:140px;">Length</th><th style="width:140px;">Width</th><th style="width:140px;">Thickness</th>
      <th style="width:70px;">Qty</th><th style="width:90px;">CFT</th><th style="width:90px;">CBM</th><th style="width:40px;"></th>
    </tr></thead>
    <tbody id="calc-tbody">${CALC_ITEMS.map((it,i)=>calcRowHTML(it,i)).join('')}</tbody>
  </table>
  </div>
  <button class="btn btn-sm" style="margin-top:8px;" onclick="addCalcRow()">+ Add Size Row</button>`;
}
function addCalcRow(){ CALC_ITEMS.push(blankCalcItem()); refreshCalcTable(); }
function removeCalcRow(idx){
  CALC_ITEMS.splice(idx,1);
  if(!CALC_ITEMS.length) CALC_ITEMS.push(blankCalcItem());
  refreshCalcTable();
}
function clearCalcBatch(){
  if(CALC_ITEMS.some(it=>it.wood) && !confirm('Clear all rows in the batch calculator?')) return;
  CALC_ITEMS = [blankCalcItem()];
  refreshCalcTable();
}
function updCalcItem(idx, field, value){
  CALC_ITEMS[idx][field] = value;
  const {cft,cbm} = calcCFTCBM(CALC_ITEMS[idx]);
  const row = document.querySelector(`#calc-tbody tr[data-idx="${idx}"]`);
  if(row){
    const cells = row.querySelectorAll('td.num.mono');
    if(cells[0]) cells[0].textContent = numFmt(cft,3);
    if(cells[1]) cells[1].textContent = numFmt(cbm,4);
  }
  refreshCalcTotalsOnly();
}
function refreshCalcTable(){
  document.getElementById('calc-table-wrap').innerHTML = renderCalcTable();
  refreshCalcTotalsOnly();
}
function computeCalcTotals(){
  let pieces=0, cft=0, cbm=0;
  CALC_ITEMS.forEach(it=>{
    const r = calcCFTCBM(it);
    pieces += parseFloat(it.qty)||0; cft += r.cft; cbm += r.cbm;
  });
  return {pieces, cft:round3(cft), cbm:round3(cbm), boardFt:round2(cft*12)};
}
function refreshCalcTotalsOnly(){
  const t = computeCalcTotals();
  const box = document.getElementById('calc-totals');
  if(box){
    box.innerHTML = `
      <div class="trow"><span>Total Pieces</span><span class="mono">${numFmt(t.pieces,0)}</span></div>
      <div class="trow"><span>Total CFT</span><span class="mono">${numFmt(t.cft,3)}</span></div>
      <div class="trow"><span>Total CBM</span><span class="mono">${numFmt(t.cbm,4)}</span></div>
      <div class="trow grand"><span>Board Feet</span><span class="mono">${numFmt(t.boardFt,2)}</span></div>
    `;
  }
  const advOut = document.getElementById('bc-advanced-out');
  if(advOut){
    const wastage = parseFloat(document.getElementById('bc_wastage')?.value)||0;
    const density = parseFloat(document.getElementById('bc_density')?.value)||0;
    const rate = parseFloat(document.getElementById('bc_rate')?.value)||0;
    const rateType = document.getElementById('bc_rateType')?.value||'CFT';
    const netCft = round3(t.cft*(1-wastage/100));
    const weightKg = density>0 ? round2(t.cbm*density) : 0;
    let estValue = 0;
    if(rate>0){
      if(rateType==='CFT') estValue = t.cft*rate;
      else if(rateType==='CBM') estValue = t.cbm*rate;
      else if(rateType==='PIECE') estValue = t.pieces*rate;
      else estValue = t.cft*rate; // RFT/RMT/SFT need per-row geometry; approximate via CFT for a batch total
    }
    advOut.innerHTML = `
      <div class="grid g3" style="margin-top:12px;">
        <div class="stat ${wastage>0?'neg':''}"><div class="label">Net Usable CFT after ${wastage||0}%</div><div class="value">${numFmt(netCft,3)}</div></div>
        <div class="stat"><div class="label">Est. Total Weight</div><div class="value">${weightKg>0?numFmt(weightKg,1)+' kg':'—'}</div></div>
        <div class="stat pos"><div class="label">Est. Total Value</div><div class="value">${estValue>0?money(estValue):'—'}</div></div>
      </div>
      ${rateType!=='CFT'&&rateType!=='CBM'&&rateType!=='PIECE'&&rate>0?'<p class="page-sub">Value estimate for RFT/RMT/SFT rates uses total CFT as an approximation since a batch mixes sizes — for an exact figure, price each size individually in a Purchase/Sales voucher.</p>':''}
    `;
  }
}
function saveCalcAsLot(){
  const t = computeCalcTotals();
  if(t.cft<=0){ toast('Enter at least one size with quantity first'); return; }
  const woodGuess = CALC_ITEMS.find(it=>it.wood)?.wood || '';
  const managers = managerNames();
  const html = `
  <div class="modal-bg" onclick="if(event.target===this)closeModal()">
    <div class="modal">
      <div class="modal-head"><h3>Save Batch as New Lot</h3><button class="close-x" onclick="closeModal()">✕</button></div>
      <p class="page-sub" style="margin-top:-8px;">This adds ${numFmt(t.cft,3)} CFT (${numFmt(t.pieces,0)} pcs) to stock as a brand-new lot. It does not create a Purchase Bill — use Purchase Bill instead if this timber came from a supplier you need to pay.</p>
      <div class="grid g2">
        <div class="field"><label>Lot No.</label><input id="scl_no" value="LOT-${String(SHARED.lots.length+1).padStart(3,'0')}"></div>

        <div class="field"><label>Warehouse</label><input id="scl_warehouse" value="Main"></div>
        <div class="field"><label>Avg. Cost per CFT (optional)</label><input type="number" id="scl_rate" placeholder="e.g. 2000"></div>
        <div class="field" style="grid-column:1/-1;"><label>Purchased Via (Manager, optional)</label><input id="scl_manager" placeholder="e.g. Ramesh (Site Manager)" list="manager-name-list-calc"><datalist id="manager-name-list-calc">${managers.map(n=>`<option value="${esc(n)}">`).join('')}</datalist></div>
      </div>
      <p class="page-sub" style="margin:-4px 0 12px;">If you enter a manager, the stock value (CFT × Avg. Cost) counts as them paying you back in stock — it's logged as "Money Returned by Manager" on their Manager Ledger, and as money you received under their name in the Khata Book.</p>
      <div style="display:flex;gap:8px;justify-content:flex-end;">
        <button class="btn" onclick="closeModal()">Cancel</button>
        <button class="btn btn-primary" onclick="confirmSaveCalcAsLot(${t.cft})">Create Lot</button>
      </div>
    </div>
  </div>`;
  document.getElementById('modal-root').innerHTML = html;
}
function confirmSaveCalcAsLot(cft){
  const wood = v('scl_wood');
  if(!wood){ toast('Enter a wood name'); return; }
  const rate = parseFloat(v('scl_rate'))||0;
  const managerName = v('scl_manager');
  const id = uid();
  const lotNo = v('scl_no')||('LOT-'+(SHARED.lots.length+1));
  const links = syncStockManagerAndKhata({
    managerName, amount: round2(cft*rate), date: todayISO(),
    note: `Stock: Lot ${lotNo} — ${wood} (${numFmt(cft,3)} CFT)`,
    source: {field:'sourceLotId', id},
    links: null
  });
  SHARED.lots.push({id, lotNo, wood,
    warehouse:v('scl_warehouse')||'Main', purchasedCFT:round3(cft), soldCFT:0, avgRate:rate, managerName, ...links});
  persist(); closeModal(); toast(`✓ Lot created with ${numFmt(cft,3)} CFT`);
  CALC_ITEMS = [blankCalcItem()];
  go('lots');
}

function renderLedgerBody(){
  const partyId = v('ledger_party');
  const body = document.getElementById('ledger-body');
  if(!partyId){ body.innerHTML=''; return; }
  const p = getParty(partyId);
  const isCustomer = p.type==='customer';
  let rows = [];
  let bal = parseFloat(p.openingBalance)||0;
  rows.push({date:DB.company.booksFrom||'—', particular:'Opening Balance', voucherNo:'—', debit:isCustomer?bal:0, credit:isCustomer?0:bal});
  const txns = DB.vouchers.filter(x=>x.partyId===partyId && x.status!=='Cancelled').sort((a,b)=>a.date.localeCompare(b.date));
  txns.forEach(x=>{
    if(x.type==='sales') rows.push({date:x.date, particular:'Sales Invoice', voucherNo:x.number, debit:x.grandTotal, credit:0});

    if(x.type==='receipt') rows.push({date:x.date, particular:'Receipt ('+x.mode+')', voucherNo:x.number, debit:0, credit:x.amount});
    if(x.type==='payment') rows.push({date:x.date, particular:'Payment ('+x.mode+')', voucherNo:x.number, debit:x.amount, credit:0});
  });
  let running=0;
  const withBal = rows.map(r=>{ running += r.debit - r.credit; return {...r, balance:round2(running)}; });

  body.innerHTML = `
  <div style="display:flex;justify-content:space-between;align-items:center;margin:14px 0 8px;">
    <div class="chip">Type: ${p.type}</div>
    <div style="font-weight:700;font-size:16px;">Closing Balance: <span class="mono">${money(withBal.length?withBal[withBal.length-1].balance:0)}</span> ${withBal.length&&withBal[withBal.length-1].balance>=0?'Dr':'Cr'}</div>
  </div>
  <div class="tbl-wrap">
  <table><thead><tr><th>Date</th><th>Particular</th><th>Voucher No.</th><th class="num">Debit</th><th class="num">Credit</th><th class="num">Balance</th></tr></thead>
  <tbody>${withBal.map(r=>`<tr><td>${fmtDate(r.date)}</td><td>${r.particular}</td><td class="mono">${r.voucherNo}</td><td class="num mono">${r.debit?money(r.debit):''}</td><td class="num mono">${r.credit?money(r.credit):''}</td><td class="num mono">${money(r.balance)} ${r.balance>=0?'Dr':'Cr'}</td></tr>`).join('')}</tbody></table>
  </div>`;
}

/* =========================================================================
   KHATA BOOK — a simple, name-wise "who I gave money to / who paid me back"
   book, like a paper bill book. No party master or invoice needed — just
   pick a name and log a dated entry. Saved to disk automatically (same
   auto-save/auto-restore as the rest of the app) every time an entry is
   added or deleted, so nothing has to be saved by hand.
========================================================================= */
function khataNames(){
  const set = new Set((SHARED.khata||[]).map(e=>e.personName));
  return Array.from(set).sort((a,b)=>a.localeCompare(b));
}
function khataSummary(name){
  const mine = (SHARED.khata||[]).filter(e=>e.personName===name);
  const gave = sum(mine.filter(e=>e.type==='gave'), e=>e.amount);
  const got = sum(mine.filter(e=>e.type==='got'), e=>e.amount);
  return { gave, got, net: round2(gave-got), count: mine.length };
}
function renderKhataPage(){
  const names = khataNames();
  const entries = SHARED.khata||[];
  const totalGave = sum(entries.filter(e=>e.type==='gave'), e=>e.amount);
  const totalGot = sum(entries.filter(e=>e.type==='got'), e=>e.amount);
  const managerSet = new Set(managerNames());
  const rows = names.map(n=>{
    const s = khataSummary(n);
    const nEsc = esc(n).replace(/'/g,"\\'");
    const isMgr = managerSet.has(n);
    return `<tr>
      <td><a href="#" onclick="event.preventDefault();openKhataDetail('${nEsc}')" style="color:var(--copper-deep);text-decoration:none;font-weight:600;">${esc(n)}</a>${isMgr?' <span style="font-size:10px;color:var(--ink-soft);">(manager)</span>':''}</td>
      <td class="num mono">${money(s.gave)}</td>
      <td class="num mono">${money(s.got)}</td>
      <td class="num mono" style="font-weight:700;">${money(Math.abs(s.net))} ${s.net>0?'<span style="font-weight:400;">(they owe you)</span>':s.net<0?'<span style="font-weight:400;">(you owe them)</span>':''}</td>
      <td><button class="btn btn-sm" onclick="openKhataDetail('${nEsc}')">View</button> <button class="btn btn-sm btn-ghost" onclick="printKhataStatement('${nEsc}')">📄 PDF</button></td>
    </tr>`;
  }).join('');
  return `
  <div class="page-head">
    <div><div class="page-title">Khata Book</div><div class="page-sub">Money you gave and money you got back, name-wise — saved automatically, nothing to save by hand</div></div>
    <button class="btn btn-primary" onclick="openKhataEntryForm()">+ New Entry</button>
  </div>
  <div class="grid g3" style="margin-bottom:16px;">
    <div class="stat neg"><div class="label">Total You Gave</div><div class="value">${money(totalGave)}</div></div>
    <div class="stat pos"><div class="label">Total You Received</div><div class="value">${money(totalGot)}</div></div>
    <div class="stat ${(totalGave-totalGot)>=0?'neg':'pos'}"><div class="label">Net Outstanding</div><div class="value">${money(Math.abs(totalGave-totalGot))}</div></div>
  </div>
  <div class="card">

function saveKhataEntry(existingId){
  const name = v('kf_name');
  const amount = parseFloat(v('kf_amount'))||0;
  const type = v('kf_type');
  const date = v('kf_date')||todayISO();
  const note = v('kf_note');
  if(!name){ toast('Enter a name'); return; }
  if(amount<=0){ toast('Enter an amount'); return; }
  if(!SHARED.khata) SHARED.khata = [];
  const linkChecked = document.getElementById('kf_linkmanager')?.checked;
  const managerName = linkChecked ? (v('kf_managername')||name) : null;

  const editing = existingId ? SHARED.khata.find(x=>x.id===existingId) : null;
  let linkId = editing ? editing.managerLedgerEntryId : null;

  if(managerName){
    const mType = type==='gave' ? 'given' : 'returned';
    const ledgerNote = `Khata: ${note||(type==='gave'?'Money given':'Money received')}`;
    if(linkId){
      const le = (SHARED.managerLedger||[]).find(x=>x.id===linkId);
      if(le){ Object.assign(le, {managerName, date, type:mType, amount, note:ledgerNote}); }
      else{ const ne={id:uid(),managerName,date,type:mType,amount,note:ledgerNote,sourceKhataEntryId:existingId||null}; if(!SHARED.managerLedger)SHARED.managerLedger=[]; SHARED.managerLedger.push(ne); linkId=ne.id; }
    }else{
      const ne = {id:uid(), managerName, date, type:mType, amount, note:ledgerNote, sourceKhataEntryId: existingId||null};
      if(!SHARED.managerLedger) SHARED.managerLedger=[];
      SHARED.managerLedger.push(ne);
      linkId = ne.id;
    }
  }else if(linkId){
    SHARED.managerLedger = (SHARED.managerLedger||[]).filter(x=>x.id!==linkId);
    linkId = null;
  }

  const data = {personName:name, date, type, amount, note, managerLedgerEntryId: linkId};
  if(existingId){
    Object.assign(editing, data);
    if(linkId){ const le=(SHARED.managerLedger||[]).find(x=>x.id===linkId); if(le) le.sourceKhataEntryId = existingId; }
  }else{
    const id = uid();
    if(linkId){ const le=(SHARED.managerLedger||[]).find(x=>x.id===linkId); if(le) le.sourceKhataEntryId = id; }
    SHARED.khata.push({id, ...data});
  }
  persist(); closeModal(); toast('✓ Entry saved — auto-saved to your PC');
  renderPage();
  setTimeout(()=>renderKhataDetail(name), 0);
}

/* =========================================================================
   MANAGER LEDGER — money you give to a manager, and what they spent it on
   (worker salaries, warehouse rent, other expenses). Per-manager running
   balance = money given so far minus money spent so far, so you can see
   how much of what you gave them is still unaccounted for. Saved to disk
   automatically, same as everything else — nothing to save by hand.
========================================================================= */
const MANAGER_ENTRY_TYPES = {
  given:    {label:'Money Given (to manager)', sign:1},
  salary:   {label:'Salary Paid (to workers)', sign:-1},
  rent:     {label:'Warehouse Rent Paid',       sign:-1},
  stock:    {label:'Stock Purchased',           sign:-1},
  returned: {label:'Money Returned by Manager', sign:-1},
  other:    {label:'Other Expense',             sign:-1}
};

// Keeps a Manager Ledger entry AND a Khata Book entry in sync with a stock
// record (a Timber Lot or a Stock In (KG) entry) that names a manager and a
// cost. Called every time such a stock record is saved. `source` identifies
// where the money-out came from, so the two generated entries link back to
// it (and Edit/Delete on the Manager Ledger / Khata Book pages redirect to
// this stock record instead of letting themselves drift out of sync).
// Returns the {managerLedgerEntryId, khataEntryId} to store back on the
// stock record; pass the previous values in via `links` when editing.
// Keeps a Manager Ledger entry AND a Khata Book entry in sync with a stock
// record (a Timber Lot or a Stock In (KG) entry) that names a manager and a
// cost. Adding stock through a manager is treated as the manager PAYING YOU
// BACK — in stock form — money that was with them: it shows as "Money
// Returned by Manager" on the Manager Ledger (reduces what's still with
// them) and as "I Received" in the Khata Book (reduces what they owe you).
// Called every time such a stock record is saved. `source` identifies where
// the money-back came from, so the two generated entries link back to it
// (and Edit/Delete on the Manager Ledger / Khata Book pages redirect to
// this stock record instead of letting themselves drift out of sync).
// Returns the {managerLedgerEntryId, khataEntryId} to store back on the
// stock record; pass the previous values in via `links` when editing.
function syncStockManagerAndKhata({managerName, amount, date, note, source, links}){
  let mlId = (links && links.managerLedgerEntryId) || null;
  let khId = (links && links.khataEntryId) || null;
  if(managerName && amount>0){
    if(!SHARED.managerLedger) SHARED.managerLedger = [];
    if(!SHARED.khata) SHARED.khata = [];
    const mlData = {managerName, date, type:'returned', amount, note, [source.field]: source.id};
    const existingMl = mlId ? SHARED.managerLedger.find(x=>x.id===mlId) : null;
    if(existingMl){ Object.assign(existingMl, mlData); }
    else{ const ne={id:uid(), ...mlData}; SHARED.managerLedger.push(ne); mlId = ne.id; }

    const khData = {personName:managerName, date, type:'got', amount, note, [source.field]: source.id, managerLedgerEntryId: mlId};
    const existingKh = khId ? SHARED.khata.find(x=>x.id===khId) : null;
    if(existingKh){ Object.assign(existingKh, khData); }
    else{ const ne={id:uid(), ...khData}; SHARED.khata.push(ne); khId = ne.id; }

    const mlEntry = SHARED.managerLedger.find(x=>x.id===mlId);
    if(mlEntry) mlEntry.sourceKhataEntryId = khId;
  }else{
    if(mlId){ SHARED.managerLedger = (SHARED.managerLedger||[]).filter(x=>x.id!==mlId); mlId = null; }
    if(khId){ SHARED.khata = (SHARED.khata||[]).filter(x=>x.id!==khId); khId = null; }
  }
  return {managerLedgerEntryId: mlId, khataEntryId: khId};
}
// Removes whatever Manager Ledger / Khata Book entries a stock record had
// linked, e.g. when the stock record itself is deleted.
function removeStockManagerAndKhataLinks(links){
  if(!links) return;
  if(links.managerLedgerEntryId) SHARED.managerLedger = (SHARED.managerLedger||[]).filter(x=>x.id!==links.managerLedgerEntryId);
  if(links.khataEntryId) SHARED.khata = (SHARED.khata||[]).filter(x=>x.id!==links.khataEntryId);
}

function managerNames(){
  const set = new Set((SHARED.managerLedger||[]).map(e=>e.managerName));
  return Array.from(set).sort((a,b)=>a.localeCompare(b));
}
function managerSummary(name){
  const mine = (SHARED.managerLedger||[]).filter(e=>e.managerName===name);
  const given  = sum(mine.filter(e=>e.type==='given'),  e=>e.amount);
  const salary = sum(mine.filter(e=>e.type==='salary'), e=>e.amount);
  const rent   = sum(mine.filter(e=>e.type==='rent'),   e=>e.amount);
  const stock  = sum(mine.filter(e=>e.type==='stock'),  e=>e.amount);
  const returned = sum(mine.filter(e=>e.type==='returned'), e=>e.amount);
  const other  = sum(mine.filter(e=>e.type==='other'),  e=>e.amount);
  const spent = round2(salary+rent+stock+returned+other);
  return { given, salary, rent, stock, returned, other, spent, balance: round2(given-spent), count: mine.length };
}

function saveManagerEntry(existingId){
  const name = v('mf_name');
  const amount = parseFloat(v('mf_amount'))||0;
  if(!name){ toast('Enter a manager name'); return; }
  if(amount<=0){ toast('Enter an amount'); return; }
  if(!SHARED.managerLedger) SHARED.managerLedger = [];
  if(existingId){
    const e = SHARED.managerLedger.find(x=>x.id===existingId);
    Object.assign(e, {managerName:name, date:v('mf_date')||todayISO(), type:v('mf_type'), amount, note:v('mf_note')});
  }else{
    SHARED.managerLedger.push({id:uid(), managerName:name, date:v('mf_date')||todayISO(), type:v('mf_type'), amount, note:v('mf_note')});
  }
  persist(); closeModal(); toast('✓ Entry saved — auto-saved to your PC');
  renderPage();
  setTimeout(()=>renderManagerDetail(name), 0);
}
function deleteManagerEntry(id){
  const e = (SHARED.managerLedger||[]).find(x=>x.id===id);
  if(!e) return;
  if(e.sourceLotId){
    toast('⚠ This entry comes from a Timber Lot record — delete it from Timber Lots / Stock instead.');
    return;
  }
  if(e.sourceStockInId){
    toast('⚠ This entry comes from a Stock In record — delete it from the "Stock In (KG)" page instead.');
    return;
  }
  if(e.sourceKhataEntryId){
    toast('⚠ This entry comes from a Khata Book record — delete it from the Khata Book instead.');
    return;
  }
  if(!confirm('Delete this entry?')) return;
  const name = e.managerName;
  SHARED.managerLedger = (SHARED.managerLedger||[]).filter(x=>x.id!==id);
  persist(); toast('✓ Deleted'); renderPage();
  setTimeout(()=>renderManagerDetail(name), 0);
}

/* =========================================================================
   STOCK IN (KG) — quick stock intake by wood + thickness only, quantity in
   KG (separate from the CFT-based Timber Lots used for Sales/Purchase
   billing). Each entry can be tagged with the manager who arranged the
   purchase; if an amount is given, that's automatically logged as a
   "Stock Purchased" spend against that manager's ledger — kept in sync
   automatically, nothing to save by hand.
========================================================================= */
function stockInGroups(){
  const map = {};
  (SHARED.stockInKG||[]).forEach(e=>{
    const key = e.wood+'|||'+e.thickness;
    if(!map[key]) map[key] = {wood:e.wood, thickness:e.thickness, qty:0, amount:0};
    map[key].qty = round3(map[key].qty + e.qty);
    map[key].amount = round2(map[key].amount + (e.amount||0));
  });
  return Object.values(map).sort((a,b)=>a.wood.localeCompare(b.wood)||a.thickness.localeCompare(b.thickness));
}
function renderStockInPage(){
  const list = (SHARED.stockInKG||[]).slice().sort((a,b)=>b.date.localeCompare(a.date)||b.id.localeCompare(a.id));
  const groups = stockInGroups();
  const totalKG = round3(sum(SHARED.stockInKG||[], e=>e.qty));
  const totalAmt = round2(sum(SHARED.stockInKG||[], e=>e.amount||0));

  return `
  <div class="page-head">

  <div class="grid g3" style="margin-bottom:16px;">

    <div class="stat"><div class="label">Total Value</div><div class="value">${money(totalAmt)}</div></div>
    <div class="stat"><div class="label">Total Bhada Paid</div><div class="value">${money(totalBhada)}</div></div>
  </div>
  <div class="card">
    <div class="card-title">On Hand by Wood &amp; Thickness</div>
    <p class="page-sub" style="margin-top:-6px;">CFT (approx) uses the density set per wood in <a href="#" onclick="event.preventDefault();go('settings')" style="color:var(--copper-deep);">Company &amp; Settings</a>, and rolls up into the <a href="#" onclick="event.preventDefault();go('lots')" style="color:var(--copper-deep);">Timber Lots / Stock</a> combined view too.</p>
    <div class="tbl-wrap">
    <table><thead><tr><th>Wood</th><th>Thickness</th><th class="num">Total Qty (kg)</th><th class="num">≈ CFT</th><th class="num">Total Value</th></tr></thead>
    <tbody>${groups.length?groups.map(g=>{const c=kgToCFT(g.wood,g.qty);return `<tr><td>${esc(g.wood)}</td><td>${esc(g.thickness)}</td><td class="num mono">${numFmt(g.qty,2)}</td><td class="num mono">${c!==null?numFmt(c,2):'set density'}</td><td class="num mono">${money(g.amount)}</td></tr>`;}).join(''):'<tr><td colspan="5" class="empty">No stock-in entries yet.</td></tr>'}</tbody></table>
    </div>
  </div>
  <div class="card">
    <div class="card-title">Stock In History</div>
    <div class="tbl-wrap">
    <table><thead><tr><th>Date</th><th>Wood</th><th>Thickness</th><th class="num">Qty (kg)</th><th class="num">Rate/kg</th><th class="num">Amount</th><th class="num">Bhada</th><th>Manager</th><th>Note</th><th></th></tr></thead>
    <tbody>${list.length?list.map(e=>`<tr>
      <td>${fmtDate(e.date)}</td>

function saveStockInEntry(existingId){
  const wood = v('si_wood');
  const thickness = v('si_thickness');
  const qty = parseFloat(v('si_qty'))||0;
  if(!wood){ toast('Enter wood / species'); return; }
  if(!thickness){ toast('Enter thickness'); return; }
  if(qty<=0){ toast('Enter quantity in kg'); return; }
  const rate = parseFloat(v('si_rate'))||0;
  const amount = parseFloat(v('si_amount'))||0;
  const bhada = parseFloat(v('si_bhada'))||0;
  const managerName = v('si_manager');
  const date = v('si_date')||todayISO();
  const note = v('si_note');

  const editing = existingId ? (SHARED.stockInKG||[]).find(x=>x.id===existingId) : null;
  const id = existingId || uid();

  const links = syncStockManagerAndKhata({
    managerName, amount, date,
    note: `Stock: ${wood} ${thickness} (${numFmt(qty,2)} kg)${note?' — '+note:''}`,
    source: {field:'sourceStockInId', id},
    links: editing ? {managerLedgerEntryId: editing.managerLedgerEntryId, khataEntryId: editing.khataEntryId} : null
  });

  const data = {wood, thickness, qty, rate, amount, bhada, managerName, date, note, ...links};

}

========================================================================= */
function renderCashBankPage(){
  const receipts = receiptVouchers(); const payments = paymentVouchers();
  function book(mode){
    const inflow = receipts.filter(r=>mode==='cash'? r.mode==='Cash' : r.mode!=='Cash');
    const outflow = payments.filter(r=>mode==='cash'? r.mode==='Cash' : r.mode!=='Cash');
    const rows = [...inflow.map(r=>({date:r.date,particular:(getParty(r.partyId)?.name||'Receipt')+' — '+r.mode,voucherNo:r.number,in:r.amount,out:0})),
                  ...outflow.map(r=>({date:r.date,particular:(getParty(r.partyId)?.name||r.expenseCategory||'Payment')+' — '+r.mode,voucherNo:r.number,in:0,out:r.amount}))]
                  .sort((a,b)=>a.date.localeCompare(b.date));
    let running=0;
    const withBal = rows.map(r=>{ running+=r.in-r.out; return {...r, balance:round2(running)}; });
    const closing = withBal.length?withBal[withBal.length-1].balance:0;
    return {rows:withBal, closing};
  }
  const cash = book('cash'); const bank = book('bank');
  return `
  <div class="page-head"><div><div class="page-title">Cash &amp; Bank Book</div><div class="page-sub">All receipts and payments by mode</div></div></div>
  <div class="tabs">
    <div class="tab active" onclick="switchCB('cash')" id="tab-cash">Cash Book — ${money(cash.closing)}</div>
    <div class="tab" onclick="switchCB('bank')" id="tab-bank">Bank Book — ${money(bank.closing)}</div>
  </div>
  <div id="cb-cash">${cbTable(cash.rows)}</div>
  <div id="cb-bank" style="display:none;">${cbTable(bank.rows)}</div>
  `;
}
function cbTable(rows){
  return `<div class="card" style="padding:0;"><div class="tbl-wrap" style="border:none;"><table>
  <thead><tr><th>Date</th><th>Particular</th><th>Voucher</th><th class="num">In</th><th class="num">Out</th><th class="num">Balance</th></tr></thead>
  <tbody>${rows.length?rows.map(r=>`<tr><td>${fmtDate(r.date)}</td><td>${esc(r.particular)}</td><td class="mono">${r.voucherNo}</td><td class="num mono">${r.in?money(r.in):''}</td><td class="num mono">${r.out?money(r.out):''}</td><td class="num mono">${money(r.balance)}</td></tr>`).join(''):'<tr><td colspan="6" class="empty">No transactions yet.</td></tr>'}</tbody>
  </table></div></div>`;
}
function switchCB(which){
  document.getElementById('tab-cash').classList.toggle('active', which==='cash');
  document.getElementById('tab-bank').classList.toggle('active', which==='bank');
  document.getElementById('cb-cash').style.display = which==='cash'?'block':'none';
  document.getElementById('cb-bank').style.display = which==='bank'?'block':'none';
}

========================================================================= */
function renderPnLPage(){
  return `
  <div class="page-head"><div><div class="page-title">Profit &amp; Loss</div><div class="page-sub">Estimate — COGS uses current average lot cost</div></div></div>
  <div class="card">
    <div class="row" style="max-width:520px;">
      <div class="field"><label>From</label><input type="date" id="pnl_from" value="${DB.company.booksFrom||todayISO()}"></div>
      <div class="field"><label>To</label><input type="date" id="pnl_to" value="${todayISO()}"></div>
      <div style="align-self:flex-end;"><button class="btn btn-primary" onclick="computePnL()">Run</button></div>
    </div>
    <div id="pnl-out"></div>
  </div>`;
}
function computePnL(){
  const from = v('pnl_from'), to = v('pnl_to');
  const sv = salesVouchers().filter(x=>x.date>=from && x.date<=to && x.status!=='Cancelled');
  const pv = purchaseVouchers().filter(x=>x.date>=from && x.date<=to && x.status!=='Cancelled');
  const expenses = paymentVouchers().filter(x=>x.date>=from && x.date<=to && !x.partyId);
  const revenue = sv.reduce((s,x)=>s+x.taxableAmount,0);
  const cogs = estimateCOGS(sv);
  const expTotal = expenses.reduce((s,x)=>s+x.amount,0);
  const net = revenue-cogs-expTotal;
  document.getElementById('pnl-out').innerHTML = `
  <div class="totals-box" style="margin-top:16px;">
    <div class="trow"><span>Sales Revenue (taxable)</span><span class="mono">${money(revenue)}</span></div>
    <div class="trow"><span>Cost of Goods Sold (est.)</span><span class="mono">−${money(cogs)}</span></div>
    <div class="trow"><span>Operating Expenses</span><span class="mono">−${money(expTotal)}</span></div>
    <div class="trow grand" style="color:${net>=0?'var(--sap)':'var(--rust)'}"><span>Net Profit / (Loss)</span><span class="mono">${money(net)}</span></div>
  </div>
  <p class="page-sub" style="margin-top:12px;">Purchases in period: ${money(pv.reduce((s,x)=>s+x.grandTotal,0))} (goes to inventory, not directly expensed).</p>
  `;
}

function computeGstSummary(){
  const from = v('gst_from'), to = v('gst_to'), kind = v('gst_type') || 'sales';
  const vouchers = (kind==='sales' ? salesVouchers() : purchaseVouchers())
    .filter(x=>x.date>=from && x.date<=to && x.status!=='Cancelled');

  // Group item-level taxable value by GST rate, scaling each item by the
  // same discount ratio the invoice itself used (taxableAmount/subtotal).
  const byRate = {}; // rate -> {taxable, cgst, sgst, igst}
  let grandTaxable=0, grandCgst=0, grandSgst=0, grandIgst=0;

  vouchers.forEach(vch=>{
    const ratio = vch.subtotal>0 ? vch.taxableAmount/vch.subtotal : 1;
    const interstate = vch.gstType ? vch.gstType==='IGST' : (vch.igst>0);
    (vch.items||[]).forEach(it=>{
      const rate = parseFloat(it.gstRate)||0;
      const taxableVal = round2((it.amount||0)*ratio);
      const taxAmt = round2(taxableVal*rate/100);
      if(!byRate[rate]) byRate[rate] = {taxable:0, cgst:0, sgst:0, igst:0};
      byRate[rate].taxable = round2(byRate[rate].taxable + taxableVal);
      if(interstate){ byRate[rate].igst = round2(byRate[rate].igst + taxAmt); grandIgst += taxAmt; }
      else{ const half = round2(taxAmt/2); byRate[rate].cgst = round2(byRate[rate].cgst+half); byRate[rate].sgst = round2(byRate[rate].sgst+(taxAmt-half)); grandCgst+=half; grandSgst+=(taxAmt-half); }
      grandTaxable += taxableVal;
    });
  });

  const rates = Object.keys(byRate).map(Number).sort((a,b)=>a-b);
  const rows = rates.map(r=>{
    const d = byRate[r];
    return `<tr><td>${r}%</td><td class="num mono">${money(d.taxable)}</td><td class="num mono">${money(d.cgst)}</td><td class="num mono">${money(d.sgst)}</td><td class="num mono">${money(d.igst)}</td><td class="num mono">${money(round2(d.cgst+d.sgst+d.igst))}</td></tr>`;
  }).join('');

  document.getElementById('gst-summary-out').innerHTML = `
  <div class="tbl-wrap" style="margin-top:16px;">
    <table>
      <thead><tr><th>GST Rate</th><th class="num">Taxable Value</th><th class="num">CGST</th><th class="num">SGST</th><th class="num">IGST</th><th class="num">Total Tax</th></tr></thead>
      <tbody>
        ${rows || '<tr><td colspan="6" class="empty">No vouchers in this period.</td></tr>'}
      </tbody>
      ${rates.length ? `<tfoot><tr style="font-weight:700;"><td>Total</td><td class="num mono">${money(round2(grandTaxable))}</td><td class="num mono">${money(round2(grandCgst))}</td><td class="num mono">${money(round2(grandSgst))}</td><td class="num mono">${money(round2(grandIgst))}</td><td class="num mono">${money(round2(grandCgst+grandSgst+grandIgst))}</td></tr></tfoot>` : ''}
    </table>
  </div>
  <p class="page-sub" style="margin-top:10px;">This is a rate-wise summary for your own filing reference — it is not a GSTR-1/3B export file.</p>
  `;
}

/* =========================================================================
   STOCK VALUATION REPORT — current stock quantity × average cost, wood-wise.
========================================================================= */
function renderStockValuationPage(){
  const rows = combinedStockByWood().map(r=>{
    const lotsForWood = SHARED.lots.filter(l=>l.wood===r.wood);
    const remainingCFT = lotsForWood.reduce((s,l)=>s+(l.purchasedCFT-l.soldCFT),0);
    const costOfRemaining = lotsForWood.reduce((s,l)=>s+Math.max(l.purchasedCFT-l.soldCFT,0)*(l.avgRate||0),0);
    const avgRate = remainingCFT>0 ? costOfRemaining/remainingCFT : 0;
    const value = r.totalCFT * avgRate;
    return {wood:r.wood, cft:r.totalCFT, avgRate, value};
  }).filter(r=>r.cft>0.0001 || r.value>0);

  const totalValue = rows.reduce((s,r)=>s+r.value,0);

  return `
  <div class="page-head"><div><div class="page-title">Stock Valuation</div><div class="page-sub">Current stock quantity × average purchase cost, by wood</div></div></div>
  <div class="card" style="padding:0;">
    <div class="tbl-wrap" style="border:none;">
      <table>
        <thead><tr><th>Wood</th><th class="num">Stock (CFT)</th><th class="num">Avg. Rate (₹/CFT)</th><th class="num">Est. Value</th></tr></thead>
        <tbody>
          ${rows.length ? rows.map(r=>`<tr><td>${esc(r.wood)}</td><td class="num mono">${numFmt(r.cft,2)}</td><td class="num mono">${money(r.avgRate)}</td><td class="num mono">${money(r.value)}</td></tr>`).join('') : '<tr><td colspan="4" class="empty">No stock recorded yet.</td></tr>'}
        </tbody>
        ${rows.length ? `<tfoot><tr style="font-weight:700;"><td colspan="3">Total Estimated Stock Value</td><td class="num mono">${money(totalValue)}</td></tr></tfoot>` : ''}
      </table>
    </div>
  </div>
  <p class="page-sub" style="margin-top:10px;">"KG-based" stock (converted via species density) is valued using each wood's average lot rate as an estimate.</p>
  `;
}

function printInvoice(id){
  const vch = DB.vouchers.find(x=>x.id===id);
  if(!vch) return;
  const p = getParty(vch.partyId);
  const c = DB.company;
  const isSales = vch.type==='sales';
  const interstate = vch.gstType ? vch.gstType==='IGST' : vch.igst>0;
  const totalTax = round2((vch.cgst||0)+(vch.sgst||0)+(vch.igst||0));

  // On the printed Tax Invoice, CFT-rated items are shown in CBM instead of CFT
  // (quantity and rate are converted so Amount still checks out). CFT/CBM are
  // entered manually per row now, so we use whichever the item has (deriving
  // the missing one via the standard conversion factor) instead of a
  // dimension-based calculation.
  const getPrintBillQty = (it)=>{
    const bq = getItemBillQty(it);
    if(bq.unit==='CFT'){
      const {cbm} = effectiveCftCbm(it);
      return {qty: cbm, unit:'CBM', rate: round2((parseFloat(it.rate)||0)/0.0283168)};
    }
    return {qty: bq.qty, unit: bq.unit, rate: parseFloat(it.rate)||0};
  };

  const rows = (vch.items||[]).map((it,i)=>{
    const bq = getPrintBillQty(it);
    const desc = `${esc(it.wood)}${it.species?(' ('+esc(it.species)+')'):''}`;
    const dims = `Qty ${it.qty||''}`;
    return `
    <tr>
      <td class="center">${i+1}</td>
      <td>${desc}<br><span style="color:#666;font-size:9.5px;">${dims}</span></td>
      <td class="center">${esc(it.hsn||'')}</td>
      <td class="num">${numFmt(bq.qty, bq.unit==='PCS'?0:3)} ${bq.unit}</td>
      <td class="num">${it.rateType==='CUSTOM'?'—':numFmt(bq.rate,2)}</td>
      <td class="center">${it.rateType==='CUSTOM'?'Nos':bq.unit}</td>
      <td class="num">${numFmt(it.amount,2)}</td>
    </tr>`;
  }).join('');

  // The printed bill intentionally shows only the item rows, the selected
  // GST (CGST+SGST or IGST), and the Grand Total — no Bill Short, discount,
  // or freight/loading/etc. breakdown. Those still affect internal figures
  // where relevant but are never itemised on the customer-facing bill.
  const taxRate = vch.taxableAmount>0 ? round2((totalTax/vch.taxableAmount)*100) : 0;
  const taxRateStr = (Math.round(taxRate*100)/100).toString();
  const taxLabel = interstate ? `OUT IGST ${taxRateStr}%` : `OUT CGST + SGST ${taxRateStr}%`;

  const taxRow = `
    <tr class="ti-plain-row"><td></td><td><i>${taxLabel}</i></td><td></td><td></td><td class="num">${taxRateStr}</td><td class="center">%</td><td class="num">${numFmt(totalTax,2)}</td></tr>`;

  const totalQtyByUnit = {};
  (vch.items||[]).forEach(it=>{ const bq=getPrintBillQty(it); totalQtyByUnit[bq.unit]=(totalQtyByUnit[bq.unit]||0)+bq.qty; });
  const totalQtyStr = Object.entries(totalQtyByUnit).map(([u,n])=>`${numFmt(n,u==='PCS'?0:3)} ${u}`).join(', ');

  // HSN/SAC summary — group items by HSN code, with the CGST/SGST (or IGST)
  // rate + amount breakup shown per HSN, matching the classic Tax Invoice format.
  const hsnMap = {};
  (vch.items||[]).forEach(it=>{
    const hsn = it.hsn||'—';
    hsnMap[hsn] = (hsnMap[hsn]||0) + (it.amount||0);
  });
  const hsnRatio = vch.subtotal>0 ? vch.taxableAmount/vch.subtotal : 1;
  const halfRate = round2(taxRate/2);
  const halfRateStr = (Math.round(halfRate*100)/100).toString();

  const hsnRows = Object.entries(hsnMap).map(([hsn,amt])=>{
    const taxableVal = round2(amt*hsnRatio);
    if(interstate){
      const igstAmt = round2(taxableVal*taxRate/100);
      return `<tr><td>${esc(hsn)}</td><td class="num">${numFmt(taxableVal,2)}</td><td class="center">${taxRateStr}%</td><td class="num">${numFmt(igstAmt,2)}</td><td class="num">${numFmt(igstAmt,2)}</td></tr>`;
    }
    const cgstAmt = round2(taxableVal*halfRate/100);
    const sgstAmt = round2(taxableVal*halfRate/100);
    return `<tr><td>${esc(hsn)}</td><td class="num">${numFmt(taxableVal,2)}</td><td class="center">${halfRateStr}%</td><td class="num">${numFmt(cgstAmt,2)}</td><td class="center">${halfRateStr}%</td><td class="num">${numFmt(sgstAmt,2)}</td><td class="num">${numFmt(cgstAmt+sgstAmt,2)}</td></tr>`;
  }).join('');

  const hsnHead = interstate
    ? `<tr><th rowspan="2">HSN/SAC</th><th rowspan="2">Taxable<br>Value</th><th colspan="2">IGST</th><th rowspan="2">Total<br>Tax Amount</th></tr><tr><th>Rate</th><th>Amount</th></tr>`
    : `<tr><th rowspan="2">HSN/SAC</th><th rowspan="2">Taxable<br>Value</th><th colspan="2">CGST</th><th colspan="2">SGST/UTGST</th><th rowspan="2">Total<br>Tax Amount</th></tr><tr><th>Rate</th><th>Amount</th><th>Rate</th><th>Amount</th></tr>`;

  const hsnTotalRow = interstate

  const stateCode = getStateCode(c.state);

    einvBarHtml = `

  // Company's Bank Details — shown beside the signature, only if entered in Settings.
  const bankHtml = (c.bankName||c.bankAcc) ? `
    <div class="ti-bank">
      <div class="bank-title">Company's Bank Details</div>

      ${c.bankName?`<span class="k">Bank Name</span>: ${esc(c.bankName)}<br>`:''}
      ${c.bankAcc?`<span class="k">A/c No.</span>: ${esc(c.bankAcc)}<br>`:''}
      ${c.bankBranch?`<span class="k">Branch &amp; IFS Code</span>: ${esc(c.bankBranch)}<br>`:''}
      ${c.upiId?`<span class="k">UPI ID</span>: ${esc(c.upiId)}`:''}
    </div>` : '';

  const html = `
  <div class="inv-page">
    <div class="ti-title">${isSales?'Tax Invoice':'Purchase Bill'}</div>
    ${einvActive?'<div class="einv-tag-abs">e-Invoice</div>':''}
    ${einvBarHtml}
    <table class="ti-frame">
      <tbody>
        <tr>
          <td style="width:55%;">

              ${esc(c.address||'')}${c.city?(', '+esc(c.city)):''}${c.state?(', '+esc(c.state)):''} ${esc(c.pin||'')}<br>
              ${c.gstin?('GSTIN/UIN: '+esc(c.gstin)+'<br>'):''}
              ${c.state?('State Name: '+esc(c.state)+(stateCode?(', Code: '+stateCode):'')+'<br>'):''}

/* =========================================================================
   SEARCH
========================================================================= */
function closeSearchResults(){
  const el = document.getElementById('search-results');
  if(el){ el.style.display='none'; el.innerHTML=''; }
}

function searchGoVoucher(id){
  const v = DB.vouchers.find(x=>x.id===id);
  closeSearchResults();
  if(v) go(v.type==='sales'?'sales':(v.type==='purchase'?'purchase':(v.type==='receipt'?'receipts':'payments')));
}
function searchGoParty(id){ closeSearchResults(); openPartyLedgerView(id); }
function searchGoLot(){ closeSearchResults(); go('lots'); }

function doSearch(qRaw){
  const q = qRaw.trim().toLowerCase();
  const box = document.getElementById('search-results');
  if(!box) return;
  if(!q || q.length<2){ closeSearchResults(); return; }

  const invMatches = (DB.vouchers||[]).filter(v=>(v.number||'').toLowerCase().includes(q)).slice(0,5);
  const partyMatches = (DB.parties||[]).filter(p=>(p.name||'').toLowerCase().includes(q) || (p.mobile||'').includes(q) || (p.gstin||'').toLowerCase().includes(q)).slice(0,5);
  const lotMatches = (SHARED.lots||[]).filter(l=>(l.lotNo||'').toLowerCase().includes(q) || (l.wood||'').toLowerCase().includes(q)).slice(0,5);

  if(!invMatches.length && !partyMatches.length && !lotMatches.length){
    box.style.display='block';
    box.innerHTML = '<div style="padding:12px;color:var(--ink-soft);font-size:13px;">No matches</div>';
    return;
  }

  let html = '';
  if(invMatches.length){
    html += '<div style="padding:6px 12px;font-size:11px;font-weight:700;color:var(--ink-soft);text-transform:uppercase;">Vouchers</div>';
    invMatches.forEach(v=>{
      html += `<div class="dd-item" onclick="searchGoVoucher('${v.id}')" style="cursor:pointer;padding:8px 12px;">${esc(v.number)} <span style="color:var(--ink-soft);">— ${esc(v.type)}</span></div>`;
    });
  }
  if(partyMatches.length){
    html += '<div style="padding:6px 12px;font-size:11px;font-weight:700;color:var(--ink-soft);text-transform:uppercase;">Parties</div>';
    partyMatches.forEach(p=>{
      html += `<div class="dd-item" onclick="searchGoParty('${p.id}')" style="cursor:pointer;padding:8px 12px;">${esc(p.name)} <span style="color:var(--ink-soft);">— ${esc(p.mobile||'')}</span></div>`;
    });
  }
  if(lotMatches.length){
    html += '<div style="padding:6px 12px;font-size:11px;font-weight:700;color:var(--ink-soft);text-transform:uppercase;">Lots</div>';
    lotMatches.forEach(l=>{
      html += `<div class="dd-item" onclick="searchGoLot()" style="cursor:pointer;padding:8px 12px;">${esc(l.lotNo)} <span style="color:var(--ink-soft);">— ${esc(l.wood)}</span></div>`;
    });
  }
  box.innerHTML = html;
  box.style.display = 'block';
}

/* =========================================================================
   KEYBOARD SHORTCUTS
========================================================================= */
document.addEventListener('keydown', (e)=>{
  if(document.getElementById('modal-root').innerHTML) return; // don't hijack while typing in modal
  if(e.key==='F8'){ e.preventDefault(); openSalesForm(); }
  if(e.key==='F9'){ e.preventDefault(); openPurchaseForm(); }
  if(e.key==='F6'){ e.preventDefault(); openReceiptForm(); }
  if(e.key==='F5'){ e.preventDefault(); openPaymentForm(); }
  if(e.key==='Escape'){ closeModal(); }
});

/* =========================================================================
   BOOT
========================================================================= */
async function bootApp(){
  await loadDB();
  renderNav();
  renderPage();
  maybeRemindBackup();
  maybeCheckLowStock();
  const tbUser = document.getElementById('tb-user');
  if(tbUser) tbUser.textContent = (CURRENT_USER && (CURRENT_USER.displayName||CURRENT_USER.username)) || '';
  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('/service-worker.js').catch(()=>{});
  }
}

(async function boot(){
  const alreadyIn = await initAuthGate();
  if(alreadyIn) await bootApp();
  // else: login screen is showing; bootApp() runs after doLogin()/doSignup() succeed.
})();

function maybeRemindBackup(){
  const hasData = (DB.parties.length + DB.vouchers.length + SHARED.lots.length) > 0;
  if(!hasData) return;
  const last = localStorage.getItem(BACKUP_KEY);
  const daysSince = last ? (Date.now()-new Date(last).getTime())/86400000 : Infinity;
  if(daysSince >= 7){
    setTimeout(()=>toast(last?'⚠ Backup is over a week old — grab a fresh one from Settings':'⚠ No backup yet — download one from Company & Settings'), 1200);
  }
}
