<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Sawmill — Timber Trading ERP</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#1f2937">
<link rel="icon" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sawmill ERP">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bark:#241c16;
  --bark-2:#332720;
  --paper:#fbf9f4;
  --paper-2:#f2ede2;
  --line:#e2d9c8;
  --ink:#241c16;
  --ink-soft:#6b6055;
  --copper:#b56a3a;
  --copper-deep:#8f4f28;
  --sap:#4a6b4f;
  --rust:#a33b2e;
  --gold:#c99a4a;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Inter',sans-serif;
  background:var(--paper-2);
  color:var(--ink);
  font-size:14px;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.slab{font-family:'Zilla Slab',serif;}
.mono{font-family:'JetBrains Mono',monospace;}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:6px;}

#shell{display:flex;min-height:100vh;}

/* ---------- Sidebar ---------- */
#sidebar{
  width:238px;flex-shrink:0;background:var(--bark);color:#e9e0d2;
  display:flex;flex-direction:column;
  background-image:
    repeating-linear-gradient(180deg, rgba(255,255,255,0.02) 0px, rgba(255,255,255,0.02) 2px, transparent 2px, transparent 40px);
}
#brand{
  padding:22px 20px 16px;border-bottom:1px solid rgba(233,224,210,0.12);
}
#brand .mark{
  display:inline-flex;align-items:center;justify-content:center;
  width:34px;height:34px;border-radius:6px;background:linear-gradient(160deg,var(--copper),var(--copper-deep));
  color:#fff;font-family:'Zilla Slab',serif;font-weight:700;font-size:17px;margin-right:10px;
  box-shadow:0 2px 6px rgba(0,0,0,.35);
}
#brand .name{font-family:'Zilla Slab',serif;font-size:19px;font-weight:600;letter-spacing:.2px;}
#brand .tag{font-size:10.5px;letter-spacing:1.5px;text-transform:uppercase;color:#a99a85;margin-top:3px;padding-left:44px;}
nav{padding:14px 10px;overflow-y:auto;flex:1;}
.nav-group{margin-bottom:6px;}
.nav-label{font-size:10.5px;text-transform:uppercase;letter-spacing:1.3px;color:#8f8271;padding:14px 12px 6px;}
.nav-item{
  display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:6px;cursor:pointer;
  font-size:13.5px;color:#d9cfbe;transition:background .12s;
}
.nav-item:hover{background:rgba(233,224,210,0.08);}
.nav-item.active{background:linear-gradient(90deg,rgba(181,106,58,.35),rgba(181,106,58,.08));color:#fff;box-shadow:inset 3px 0 0 var(--copper);}
.nav-item .kbd{margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:10px;color:#8f8271;border:1px solid #4a4038;border-radius:4px;padding:1px 5px;}
#sidebar-foot{padding:12px 18px;border-top:1px solid rgba(233,224,210,0.12);font-size:11px;color:#8f8271;}

/* ---------- Main ---------- */
#main{flex:1;min-width:0;display:flex;flex-direction:column;}
#topbar{
  height:58px;background:var(--paper);border-bottom:1px solid var(--line);
  display:flex;align-items:center;padding:0 22px;gap:16px;flex-shrink:0;
}
#topbar .co{font-family:'Zilla Slab',serif;font-weight:600;font-size:16px;}
.co-switch{
  font-family:'Zilla Slab',serif;font-weight:600;font-size:16px;background:none;border:none;cursor:pointer;
  color:var(--ink);padding:6px 8px;border-radius:6px;display:flex;align-items:center;gap:6px;
}
.co-switch:hover{background:var(--paper-2);}
.co-switch .caret{font-size:11px;color:var(--ink-soft);}
.company-dropdown{
  position:absolute;top:calc(100% + 4px);left:0;background:#fff;border:1px solid var(--line);border-radius:10px;
  box-shadow:0 10px 30px rgba(0,0,0,.15);min-width:280px;z-index:150;overflow:hidden;
}
.company-dropdown .cd-item{padding:10px 14px;font-size:13px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px;}
.company-dropdown .cd-item:hover{background:var(--paper-2);}
.company-dropdown .cd-item.active{background:#fbf3ea;font-weight:600;}
.company-dropdown .cd-new{padding:10px 14px;font-size:13px;color:var(--copper-deep);cursor:pointer;border-top:1px solid var(--line);font-weight:600;}
.company-dropdown .cd-new:hover{background:var(--paper-2);}
#topbar .fy{font-size:11px;color:var(--ink-soft);border:1px solid var(--line);padding:3px 8px;border-radius:20px;}
#search{
  margin-left:auto;width:280px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;
  background:var(--paper-2);font-size:13px;
}
.btn{
  border:1px solid var(--line);background:#fff;color:var(--ink);padding:8px 14px;border-radius:8px;
  font-size:13px;cursor:pointer;font-weight:600;transition:all .12s;display:inline-flex;align-items:center;gap:6px;
}
.btn:hover{border-color:var(--copper);color:var(--copper-deep);box-shadow:0 2px 6px rgba(36,28,22,.08);transform:translateY(-1px);}
.btn:active{transform:translateY(0);}
.btn-primary{background:linear-gradient(160deg,var(--copper),var(--copper-deep));color:#fff;border:none;box-shadow:0 2px 6px rgba(143,79,40,.3);}
.btn-primary:hover{filter:brightness(1.06);color:#fff;box-shadow:0 4px 12px rgba(143,79,40,.4);}
.btn-ghost{background:transparent;border:1px solid transparent;color:var(--ink-soft);box-shadow:none;}
.btn-ghost:hover{color:var(--copper-deep);background:rgba(181,106,58,.08);box-shadow:none;transform:none;}
.btn-sm{padding:5px 10px;font-size:12px;border-radius:6px;}
.btn-danger{color:var(--rust);}
.btn-danger:hover{border-color:var(--rust);background:rgba(163,59,46,.08);color:var(--rust);}

#content{padding:24px 28px 60px;flex:1;overflow-y:auto;}
.page-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;padding-bottom:14px;border-bottom:1px solid var(--line);}
.page-title{font-family:'Zilla Slab',serif;font-size:26px;font-weight:600;letter-spacing:.2px;}
.page-sub{color:var(--ink-soft);font-size:12.5px;margin-top:3px;}

/* Cards */
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:16px;box-shadow:0 1px 2px rgba(36,28,22,.04),0 6px 18px rgba(36,28,22,.03);transition:box-shadow .15s,transform .15s;}
.card-title{font-family:'Zilla Slab',serif;font-size:15px;font-weight:600;margin:0 0 12px;padding-bottom:10px;border-bottom:1px solid var(--line);}
.grid{display:grid;gap:16px;}
.g4{grid-template-columns:repeat(4,1fr);}
.g3{grid-template-columns:repeat(3,1fr);}
.g2{grid-template-columns:repeat(2,1fr);}

.stat{background:linear-gradient(180deg,#fff,#fffdf9);border:1px solid var(--line);border-radius:12px;padding:16px 18px;position:relative;overflow:hidden;box-shadow:0 1px 2px rgba(36,28,22,.04),0 6px 18px rgba(36,28,22,.03);transition:transform .15s,box-shadow .15s;}
.stat:hover{transform:translateY(-2px);box-shadow:0 4px 8px rgba(36,28,22,.06),0 12px 24px rgba(36,28,22,.06);}
.stat::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--copper);}
.stat .label{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--ink-soft);font-weight:600;}
.stat .value{font-family:'JetBrains Mono',monospace;font-size:23px;font-weight:700;margin-top:7px;letter-spacing:-.2px;}
.stat.neg::before{background:var(--rust);}
.stat.pos::before{background:var(--sap);}

/* Forms */
label{display:block;font-size:11.5px;color:var(--ink-soft);margin-bottom:4px;font-weight:500;}
input,select,textarea{
  width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:7px;font-size:13px;
  background:#fff;color:var(--ink);font-family:'Inter',sans-serif;transition:border-color .12s,box-shadow .12s;
}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--copper);box-shadow:0 0 0 3px rgba(181,106,58,.12);}
input:hover,select:hover{border-color:#cfc2ac;}
.field{margin-bottom:12px;}
.row{display:flex;gap:12px;}
.row>*{flex:1;}

/* Tables */
table{width:100%;border-collapse:collapse;font-size:13px;}
th{
  text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--ink-soft);
  padding:10px 10px;border-bottom:2px solid var(--line);background:var(--paper-2);position:sticky;top:0;z-index:1;font-weight:700;
}
td{padding:10px 10px;border-bottom:1px solid var(--line);}
tbody tr{transition:background .1s;}
tbody tr:hover{background:#fbf6ee;}
tbody tr:nth-child(even){background:rgba(242,237,226,.35);}
tbody tr:nth-child(even):hover{background:#fbf6ee;}
tr:last-child td{border-bottom:none;}
.tbl-wrap{overflow-x:auto;border-radius:10px;border:1px solid var(--line);max-height:70vh;overflow-y:auto;}
.num{text-align:right;font-family:'JetBrains Mono',monospace;}
.center{text-align:center;}

.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:.2px;}
.badge-paid{background:#e5efe6;color:var(--sap);}
.badge-partial{background:#fbf0dd;color:var(--gold);}
.badge-unpaid{background:#fbe6e2;color:var(--rust);}
.badge-cancelled{background:#eee;color:#888;}

.items-table{table-layout:fixed;width:1485px;}
.items-table td{overflow:hidden;}
.items-table input,.items-table select{width:100%;min-width:0;}
.item-row input,.item-row select{padding:6px 8px;font-size:12.5px;}
.item-row td{padding:5px 6px;vertical-align:middle;}
.item-row input[type=number]::-webkit-outer-spin-button,
.item-row input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
.item-row input[type=number]{-moz-appearance:textfield;}
.dim-cell{display:flex;gap:3px;}
.dim-cell input{width:52px;}
.dim-cell select{width:58px;font-size:10.5px;padding:6px 2px;}

.formula-strip{
  background:var(--paper-2);border:1px dashed var(--line);border-radius:8px;padding:10px 14px;
  font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--ink-soft);margin:10px 0;
}

.totals-box{width:340px;margin-left:auto;}
.totals-box .trow{display:flex;justify-content:space-between;padding:6px 2px;font-size:13px;}
.totals-box .trow.grand{border-top:2px solid var(--ink);margin-top:6px;padding-top:10px;font-weight:700;font-size:16px;}
.totals-box .trow input{width:110px;text-align:right;padding:5px 8px;}

.empty{text-align:center;padding:50px 20px;color:var(--ink-soft);}
.empty .big{font-size:32px;margin-bottom:8px;}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;}
.tab{padding:9px 16px;font-size:13px;cursor:pointer;border-bottom:2px solid transparent;color:var(--ink-soft);font-weight:500;}
.tab.active{color:var(--copper-deep);border-bottom-color:var(--copper);}

.modal-bg{position:fixed;inset:0;background:rgba(36,28,22,.55);backdrop-filter:blur(2px);display:flex;align-items:flex-start;justify-content:center;z-index:200;padding:40px 20px;overflow-y:auto;}
.modal{background:#fff;border-radius:14px;width:100%;max-width:560px;padding:22px;box-shadow:0 24px 70px rgba(0,0,0,.35);}
.modal.wide{max-width:960px;}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--line);}
.modal-head h3{margin:0;font-size:18px;font-family:'Zilla Slab',serif;font-weight:600;}
.close-x{cursor:pointer;color:var(--ink-soft);font-size:20px;background:none;border:none;border-radius:6px;padding:2px 6px;transition:all .12s;}
.close-x:hover{color:var(--rust);background:rgba(163,59,46,.08);}

.toast{position:fixed;bottom:24px;right:24px;background:var(--bark);color:#fff;padding:12px 18px;border-radius:8px;font-size:13px;z-index:500;box-shadow:0 8px 24px rgba(0,0,0,.3);}

.chip{display:inline-block;background:var(--paper-2);border:1px solid var(--line);border-radius:20px;padding:3px 10px;font-size:11px;margin-right:6px;}

/* ------------- PRINT INVOICE (classic Tax Invoice format) ------------- */
#print-root{display:none;}
.inv-page{
  background:#fff;width:210mm;min-height:297mm;margin:0 auto 20px;padding:10mm 10mm;
  font-family:'Inter',sans-serif;color:#111;position:relative;font-size:11px;
  text-transform:uppercase;
}
.ti-title{text-align:center;font-weight:700;font-size:16px;padding:4px 0 10px;}
.ti-frame{width:100%;border-collapse:collapse;border:1px solid #000;}
.ti-frame > tbody > tr > td{border:1px solid #000;padding:0;vertical-align:top;}
.ti-cell{padding:8px 10px;}
.ti-cell b{font-size:12.5px;}
.ti-lab{font-size:9px;color:#555;text-transform:uppercase;letter-spacing:.3px;margin-bottom:2px;}
.ti-meta{width:100%;border-collapse:collapse;font-size:10px;table-layout:fixed;}
.ti-meta td{border-bottom:1px solid #000;border-left:1px solid #000;padding:5px 8px;vertical-align:top;}
.ti-meta tr:last-child td{border-bottom:none;}
.ti-meta td:first-child{border-left:none;}
.ti-meta .lab{font-size:9px;color:#555;}
.ti-meta .val{font-weight:600;margin-top:1px;}
.ti-items{width:100%;border-collapse:collapse;font-size:10.5px;margin-top:0;}
.ti-items th{border:1px solid #000;padding:5px 6px;font-size:9.5px;text-transform:uppercase;font-weight:700;}
.ti-items td{border-left:1px solid #000;border-right:1px solid #000;padding:5px 6px;vertical-align:top;}
.ti-items tbody tr:first-child td{border-top:1px solid #000;}
.ti-items tfoot td{border:1px solid #000;font-weight:700;padding:6px;}
.ti-items .num{text-align:right;}
.ti-items .center{text-align:center;}
.ti-plain-row td{border-left:1px solid #000;border-right:1px solid #000;}
.ti-words{border:1px solid #000;border-top:none;padding:6px 10px;font-size:10.5px;}
.ti-words .top-row{display:flex;justify-content:space-between;}
.ti-words b{display:block;margin-top:4px;}
.ti-hsn{width:100%;border-collapse:collapse;font-size:10px;margin-top:10px;}
.ti-hsn th, .ti-hsn td{border:1px solid #000;padding:5px 8px;}
.ti-hsn th{font-size:9.5px;text-transform:uppercase;}
.ti-hsn .num{text-align:right;}
.ti-taxwords{border:1px solid #000;border-top:none;padding:6px 10px;font-size:10.5px;}
.ti-declare{display:flex;justify-content:space-between;border:1px solid #000;border-top:none;padding:10px;font-size:10px;margin-bottom:0;}
.ti-declare .sign{text-align:right;}
.ti-declare .sign .box{margin-top:44px;}
.ti-computer{text-align:center;font-size:10px;color:#333;margin-top:6px;}
.page-tag{position:absolute;bottom:6mm;right:10mm;font-size:9px;color:#999;}

/* e-Invoice IRN/QR strip shown above the frame table when an IRN is on file */
.einv-tag-abs{position:absolute;top:10mm;right:10mm;font-size:11px;font-weight:700;letter-spacing:.5px;}
.ti-einv-bar{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;font-size:9.5px;line-height:1.55;margin-bottom:6px;}
.ti-einv-bar .irn-block{max-width:76%;word-break:break-all;}
.ti-einv-bar .irn-block .k{display:inline-block;min-width:58px;color:#333;}
.ti-einv-bar .qr-block{text-align:center;flex-shrink:0;}
.ti-einv-bar .qr-block svg{width:24mm;height:24mm;display:block;}

/* Bank details, shown beside the signature block */
.ti-declare .decl-block{max-width:56%;}
.ti-bank{font-size:9.5px;line-height:1.6;text-align:left;margin-bottom:6px;}
.ti-bank .bank-title{font-weight:700;}
.ti-bank .k{display:inline-block;min-width:88px;color:#333;}

/* ---------- e-Way Bill (second sheet) ---------- */
.ewb-title{text-align:center;font-weight:700;font-size:16px;padding:4px 0 10px;}
.ewb-tag-abs{position:absolute;top:10mm;right:10mm;font-size:11px;font-weight:700;letter-spacing:.5px;}
.ewb-top{display:flex;justify-content:space-between;align-items:flex-start;font-size:9.5px;line-height:1.55;margin-bottom:8px;}
.ewb-top .doc-block .k{display:inline-block;min-width:70px;color:#333;}
.ewb-top .qr-block{text-align:center;flex-shrink:0;}
.ewb-top .qr-block svg{width:24mm;height:24mm;display:block;}
.ewb-sec{border:1px solid #000;margin-bottom:-1px;}
.ewb-sec-title{font-weight:700;font-size:9.5px;text-transform:uppercase;padding:4px 8px;border-bottom:1px solid #000;background:#f2f2f2;}
.ewb-kv{width:100%;border-collapse:collapse;font-size:10px;}
.ewb-kv td{padding:6px 8px;vertical-align:top;}
.ewb-addr2{width:100%;border-collapse:collapse;font-size:10px;}
.ewb-addr2 td{padding:8px;width:50%;vertical-align:top;border-top:1px solid #000;}
.ewb-addr2 tr:first-child td{border-top:none;}
.ewb-addr2 td:first-child{border-right:1px solid #000;}
.ewb-lab{font-size:9px;color:#555;text-transform:uppercase;margin-bottom:2px;}
.ewb-goods{width:100%;border-collapse:collapse;font-size:10px;}
.ewb-goods th,.ewb-goods td{border:1px solid #000;padding:6px 8px;}
.ewb-goods th{font-size:9px;text-transform:uppercase;background:#f2f2f2;}
.ewb-goods .num{text-align:right;}
.ewb-totals{width:100%;border-collapse:collapse;font-size:10px;border-top:1px solid #000;}
.ewb-totals td{padding:6px 8px;width:33.33%;vertical-align:top;}
.ewb-page-tag{text-align:center;font-size:10px;color:#333;margin-top:10px;}

@media print{
  body *{visibility:hidden;}
  #print-root, #print-root *{visibility:visible;}
  #print-root{display:block;position:absolute;left:0;top:0;width:100%;}
  .inv-page{box-shadow:none;margin:0;width:auto;min-height:0;}
  .inv-page + .inv-page{page-break-before:always;}
  .no-print{display:none!important;}
}

/* ---------- Login screen ---------- */
#login-root{position:fixed;inset:0;z-index:9999;background:linear-gradient(160deg,var(--bark),var(--bark-2));display:flex;align-items:center;justify-content:center;padding:20px;}
.login-card{width:100%;max-width:380px;background:var(--paper);border-radius:14px;padding:36px 30px;box-shadow:0 20px 60px rgba(0,0,0,.4);}
.login-card .mark{display:inline-flex;align-items:center;justify-content:center;width:48px;height:48px;border-radius:12px;background:var(--copper);color:#fff;font-family:'Zilla Slab',serif;font-weight:700;font-size:22px;margin-bottom:14px;}
.login-card h1{font-size:20px;margin:0 0 4px;}
.login-card p.sub{color:var(--ink-soft);font-size:13px;margin:0 0 22px;}
.login-card label{display:block;font-size:12px;font-weight:600;color:var(--ink-soft);margin:14px 0 5px;}
.login-card input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;font-size:14px;background:#fff;}
.login-card input:focus{outline:2px solid var(--copper);outline-offset:1px;}
.login-card button.btn-login{width:100%;margin-top:20px;padding:11px;border:none;border-radius:8px;background:var(--copper);color:#fff;font-weight:600;font-size:14px;cursor:pointer;}
.login-card button.btn-login:hover{background:var(--copper-deep);}
.login-card button.btn-login:disabled{opacity:.6;cursor:default;}
.login-err{margin-top:14px;padding:9px 11px;border-radius:8px;background:#fdeceb;color:var(--rust);font-size:12.5px;}
.login-toggle{margin-top:16px;text-align:center;font-size:12.5px;color:var(--ink-soft);}
.login-toggle a{color:var(--copper-deep);cursor:pointer;font-weight:600;}
.login-logout{display:inline-flex;align-items:center;gap:6px;cursor:pointer;}

/* =========================================================================
   MOBILE / RESPONSIVE
   Desktop keeps the fixed sidebar + centered modals. Below 900px the
   sidebar becomes a slide-in drawer behind a hamburger button; below
   640px the topbar stacks, modals become full-screen sheets, the
   primary action moves to a floating button, and grids/forms go
   single-column with touch-sized targets.
========================================================================= */
#hamburger{display:none;font-size:17px;padding:6px 10px;flex-shrink:0;}
#brand{position:relative;}
#sidebar-close{
  display:none;position:absolute;top:16px;right:10px;background:none;border:none;
  color:#d9cfbe;font-size:18px;line-height:1;cursor:pointer;padding:6px 8px;border-radius:6px;
}
#sidebar-close:hover{background:rgba(233,224,210,0.1);}
#sidebar-backdrop{display:none;position:fixed;inset:0;background:rgba(36,28,22,.5);z-index:250;}
.fab{
  display:none;position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom));
  width:56px;height:56px;border-radius:50%;background:linear-gradient(160deg,var(--copper),var(--copper-deep));
  color:#fff;border:none;box-shadow:0 6px 20px rgba(143,79,40,.45);font-size:28px;line-height:1;
  align-items:center;justify-content:center;cursor:pointer;z-index:220;
}
.fab:active{transform:scale(.94);}

@media (max-width:900px){
  #hamburger{display:inline-flex;}
  #sidebar-close{display:inline-flex;}
  #sidebar{
    position:fixed;top:0;left:0;bottom:0;width:82%;max-width:300px;z-index:300;
    transform:translateX(-100%);transition:transform .25s ease;box-shadow:0 0 40px rgba(0,0,0,.35);
    padding-top:env(safe-area-inset-top);
  }
  body.sidebar-open #sidebar{transform:translateX(0);}
  body.sidebar-open #sidebar-backdrop{display:block;}
  body.sidebar-open{overflow:hidden;}

  .grid.g4{grid-template-columns:repeat(2,1fr);}
  .grid.g3{grid-template-columns:repeat(2,1fr);}
}

@media (max-width:640px){
  #content{padding:14px 14px 90px;}
  .page-head{flex-wrap:wrap;row-gap:10px;align-items:flex-start;}
  .page-title{font-size:20px;}
  .grid.g4,.grid.g3,.grid.g2{grid-template-columns:1fr;}
  .row{flex-direction:column;gap:0;}
  .totals-box{width:100%;}

  /* Topbar: hamburger + company switcher on row one, search drops to
     its own full-width row, the desktop primary button is replaced
     by the floating action button below. */
  #topbar{flex-wrap:wrap;height:auto;min-height:56px;padding:10px 12px;row-gap:8px;}
  #topbar > button.btn-primary{display:none;}
  #search-wrap{order:5;flex-basis:100%;}
  #tb-user{display:none;}
  #topbar .fy{display:none;}
  .fab{display:flex;}

  /* Modals become full-screen sheets instead of centered cards */
  .modal-bg{padding:0;align-items:stretch;}
  .modal,.modal.wide{max-width:100%;width:100%;min-height:100%;border-radius:0;padding:16px;padding-bottom:calc(24px + env(safe-area-inset-bottom));}
  .modal-head{position:sticky;top:-16px;margin:-16px -16px 14px;padding:14px 16px;background:#fff;z-index:5;}

  /* Data tables: denser, with the first column pinned while the rest
     scrolls horizontally so row identity stays visible. */
  th,td{padding:8px;font-size:12.5px;}
  .tbl-wrap table:not(.items-table) th:first-child,
  .tbl-wrap table:not(.items-table) td:first-child{
    position:sticky;left:0;background:var(--paper-2);box-shadow:2px 0 4px rgba(36,28,22,.06);
  }
  .tbl-wrap table:not(.items-table) tbody td:first-child{background:#fff;}

  /* Touch targets + prevent iOS auto-zoom on focus (needs >=16px) */
  .nav-item{padding:12px;font-size:14.5px;min-height:22px;}
  .btn{min-height:38px;}
  input,select,textarea{font-size:16px;}
  .items-table input,.items-table select,.dim-cell input,.dim-cell select{font-size:12.5px;}
}

<script>
/* =========================================================================
   AUTH — login screen + token handling. The whole app (#shell) stays
   hidden until a valid session token is present; every /api/db call goes
   through apiFetch() below, which attaches the token and bounces back to
   the login screen on a 401 (expired/invalid session).
========================================================================= */
const AUTH_TOKEN_KEY = 'sawmill_auth_token_v1';
let CURRENT_USER = null;

function getToken(){ return localStorage.getItem(AUTH_TOKEN_KEY); }
function setToken(t){ localStorage.setItem(AUTH_TOKEN_KEY, t); }
function clearToken(){ localStorage.removeItem(AUTH_TOKEN_KEY); }

async function apiFetch(url, opts){
  opts = opts || {};
  opts.headers = Object.assign({}, opts.headers, { 'Authorization': 'Bearer ' + (getToken()||'') });
  const res = await fetch(url, opts);
  if(res.status === 401){
    clearToken();
    showLoginScreen();
    throw new Error('Session expired');
  }
  return res;
}

function showLoginScreen(mode){
  document.getElementById('shell').style.display = 'none';
  const root = document.getElementById('login-root');
  root.style.display = 'flex';
  root.innerHTML = mode==='signup' ? loginSignupHTML() : loginFormHTML();
}

function hideLoginScreen(){
  document.getElementById('login-root').style.display = 'none';
  document.getElementById('login-root').innerHTML = '';
  document.getElementById('shell').style.display = 'flex';
}

function loginFormHTML(){
  return `
    <div class="login-card">
      <span class="mark">S</span>
      <h1>Welcome back</h1>
      <p class="sub">Sign in to your Sawmill ERP</p>
      <div id="login-error-slot"></div>
      <label for="li-user">Username</label>
      <input id="li-user" autocomplete="username" onkeydown="if(event.key==='Enter')doLogin()">
      <label for="li-pass">Password</label>
      <input id="li-pass" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
      <button class="btn-login" id="li-btn" onclick="doLogin()">Log in</button>
    </div>`;
}

function loginSignupHTML(){
  return `
    <div class="login-card">
      <span class="mark">S</span>
      <h1>Create your account</h1>
      <p class="sub">First time here — set up the login for this business</p>
      <div id="login-error-slot"></div>
      <label for="su-name">Your name</label>
      <input id="su-name" autocomplete="name">
      <label for="su-user">Choose a username</label>
      <input id="su-user" autocomplete="username">
      <label for="su-pass">Choose a password</label>
      <input id="su-pass" type="password" autocomplete="new-password">
      <button class="btn-login" id="su-btn" onclick="doSignup()">Create account &amp; continue</button>
    </div>`;
}

function loginErr(msg){
  document.getElementById('login-error-slot').innerHTML = msg ? `<div class="login-err">${esc(msg)}</div>` : '';
}

async function doLogin(){
  const username = document.getElementById('li-user').value.trim();
  const password = document.getElementById('li-pass').value;
  if(!username || !password){ loginErr('Enter your username and password'); return; }
  const btn = document.getElementById('li-btn'); btn.disabled = true; btn.textContent = 'Logging in…';
  try{
    const res = await fetch('/api/auth/login', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({username, password}) });
    const data = await res.json();
    if(!res.ok) throw new Error(data.error || 'Login failed');
    setToken(data.token);
    CURRENT_USER = { username: data.username, displayName: data.displayName, role: data.role };
    hideLoginScreen();
    await bootApp();
  }catch(e){
    loginErr(e.message);
  }finally{
    btn.disabled = false; btn.textContent = 'Log in';
  }
}

async function doSignup(){
  const displayName = document.getElementById('su-name').value.trim();
  const username = document.getElementById('su-user').value.trim();
  const password = document.getElementById('su-pass').value;
  if(!username || password.length<6){ loginErr('Username required; password needs 6+ characters'); return; }
  const btn = document.getElementById('su-btn'); btn.disabled = true; btn.textContent = 'Creating…';
  try{
    const res = await fetch('/api/auth/register', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({username, password, displayName}) });
    const data = await res.json();
    if(!res.ok) throw new Error(data.error || 'Could not create account');
    // Auto-login right after signup.
    const loginRes = await fetch('/api/auth/login', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({username, password}) });
    const loginData = await loginRes.json();
    if(!loginRes.ok) throw new Error(loginData.error || 'Account created — please log in');
    setToken(loginData.token);
    CURRENT_USER = { username: loginData.username, displayName: loginData.displayName, role: loginData.role };
    hideLoginScreen();
    await bootApp();
  }catch(e){
    loginErr(e.message);
  }finally{
    btn.disabled = false; btn.textContent = 'Create account & continue';
  }
}

function logout(){
  clearToken();
  CURRENT_USER = null;
  location.reload();
}

// Decides whether to show "create account" (nobody has signed up yet on
// this deployment) or the normal login form, then waits for the user.
async function initAuthGate(){
  const token = getToken();
  if(token){
    try{
      const res = await apiFetch('/api/auth/me');
      if(res.ok){
        const me = await res.json();
        CURRENT_USER = me;
        return true; // already logged in, go straight to the app
      }
    }catch(e){ /* falls through to login screen */ }
  }
  let setupNeeded = false;
  try{
    const statusRes = await fetch('/api/auth/status');
    const status = await statusRes.json();
    setupNeeded = !!status.setupNeeded;
  }catch(e){ /* default to login form if status check fails */ }
  showLoginScreen(setupNeeded ? 'signup' : 'login');
  return false;
}

/* =========================================================================
   STORAGE — multi-company aware.
   On disk (via /api/db) we keep ONE file shaped like:
     { activeCompanyId, companies: [ {id, data:{company,settings,parties,lots,vouchers}}, ... ] }
   In memory, `DB` always points at the ACTIVE company's `data` object —
   every existing function in this file reads/writes DB.company, DB.parties,
   SHARED.lots, DB.vouchers etc. exactly as before. `APP` is the outer registry
   that makes switching companies possible.
========================================================================= */
const BACKUP_KEY = 'sawmill_last_backup_v1';
let DB = null;
let APP = null; // { activeCompanyId, companies:[{id, data}], shared:{lots,khata,managerLedger,stockInKG} }
let SHARED = null; // same object reference as APP.shared — stock/khata/manager, common to every company
let SAVE_PENDING = false;

function defaultDB(){
  return {
    company:{name:'',ownerName:'',address:'',city:'',state:'',pin:'',mobile:'',whatsapp:'',email:'',gstin:'',pan:'',fy:'2026-27',booksFrom:'2026-04-01',bankHolder:'',bankName:'',bankAcc:'',bankIfsc:'',bankBranch:'',upiId:''},
    settings:{prefixes:{sales:'SAL',purchase:'PUR',receipt:'REC',payment:'PAY'},counters:{sales:0,purchase:0,receipt:0,payment:0},defaultGST:18,fyCode:'26-27',
      species:['Teak','Sal','Sheesham (Rosewood)','Mango','Pine','Deodar','Rubber Wood','Neem','Babul','Kikar','Gamhar','Mahogany','Plywood','MDF','Marine Ply'],
      density:{'Teak':750,'Sal':850,'Sheesham (Rosewood)':800,'Mango':560,'Pine':500,'Deodar':550,'Rubber Wood':560,'Neem':680,'Babul':780,'Kikar':750,'Gamhar':480,'Mahogany':600},
      lowStockThresholds:{}},
    parties:[],
    vouchers:[],
    trash:[]
  };
}

function ensureDataDefaults(data){
  if(!data.company) data.company = defaultDB().company;
  if(!data.settings) data.settings = defaultDB().settings;
  if(!data.settings.species) data.settings.species = defaultDB().settings.species;
  if(!data.settings.density) data.settings.density = defaultDB().settings.density;
  if(!data.settings.prefixes) data.settings.prefixes = defaultDB().settings.prefixes;
  if(!data.settings.counters) data.settings.counters = defaultDB().settings.counters;
  if(!data.settings.lowStockThresholds) data.settings.lowStockThresholds = {};
  if(!data.parties) data.parties = [];
  if(!data.vouchers) data.vouchers = [];
  if(!data.trash) data.trash = [];
  return data;
}

// SHARED data — timber-lot stock, KG-based stock, the Khata Book, and the
// Manager Ledger all live HERE, once, at the top level of APP (not inside
// any single company). Every company you switch between reads and writes
// this same object, so stock levels, khata entries and manager accounts are
// identical no matter which company is currently active.
function defaultShared(){
  return { lots:[], khata:[], managerLedger:[], stockInKG:[] };
}
function ensureSharedDefaults(shared){
  if(!shared.lots) shared.lots = [];
  if(!shared.khata) shared.khata = [];
  if(!shared.managerLedger) shared.managerLedger = [];
  if(!shared.stockInKG) shared.stockInKG = [];
  return shared;
}

function companyDisplayName(entry){
  return (entry.data.company && entry.data.company.name && entry.data.company.name.trim()) || 'Unnamed Company';
}

// Pulls a shared store out of `raw`, migrating older files (from before
// stock/khata/manager became shared) by merging whatever each company had
// under data.lots / data.khata / data.managerLedger / data.stockInKG into
// one combined store — so nothing already entered gets lost in the switch.
function buildSharedFromLegacy(raw){
  const shared = defaultShared();
  const seen = {lots:new Set(), khata:new Set(), managerLedger:new Set(), stockInKG:new Set()};
  const companies = (raw && Array.isArray(raw.companies)) ? raw.companies : (raw ? [{data:raw}] : []);
  companies.forEach(c=>{
    const d = c && c.data;
    if(!d) return;
    ['lots','khata','managerLedger','stockInKG'].forEach(key=>{
      (d[key]||[]).forEach(item=>{
        if(item && item.id && seen[key].has(item.id)) return;
        if(item && item.id) seen[key].add(item.id);
        shared[key].push(item);
      });
    });
  });
  return shared;
}

// Accepts whatever came back from /api/db and always returns the new
// { activeCompanyId, companies:[...], shared:{...} } shape — migrating a
// pre-multi-company file (which was just the old `data` object directly)
// into a single company, and migrating pre-shared-stock files too.
function normalizeAppData(raw){
  if(raw && Array.isArray(raw.companies) && raw.companies.length){
    raw.companies.forEach(c=>{ if(!c.data) c.data = defaultDB(); ensureDataDefaults(c.data); if(!c.id) c.id = uid(); });
    if(!raw.activeCompanyId || !raw.companies.some(c=>c.id===raw.activeCompanyId)){
      raw.activeCompanyId = raw.companies[0].id;
    }
    raw.shared = raw.shared ? ensureSharedDefaults(raw.shared) : buildSharedFromLegacy(raw);
    return raw;
  }
  if(raw && Array.isArray(raw.vouchers)){
    const shared = buildSharedFromLegacy(raw);
    ensureDataDefaults(raw);
    const id = uid();
    return { activeCompanyId:id, companies:[{id, data:raw}], shared };
  }
  const id = uid();
  return { activeCompanyId:id, companies:[{id, data:defaultDB()}], shared: defaultShared() };
}

function activateCompany(id, opts){
  opts = opts||{};
  const entry = APP.companies.find(c=>c.id===id) || APP.companies[0];
  APP.activeCompanyId = entry.id;
  DB = entry.data;
  ensureDataDefaults(DB);
  SHARED = APP.shared;
  ensureSharedDefaults(SHARED);
  if(!opts.skipPersist) persist();
}

/* ---- Backend-backed storage: data lives in a JSON file on this PC
       (server.js writes it to /data/sawmill-db.json), not in the browser. ---- */
async function loadDB(){
  try{
    const res = await apiFetch('/api/db');
    if(!res.ok) throw new Error('Server responded with ' + res.status);
    const raw = await res.json();
    APP = normalizeAppData(raw);
  }catch(e){
    console.error('load failed', e);
    toast('⚠ Could not reach the server — check your connection');
    APP = normalizeAppData(null);
  }
  activateCompany(APP.activeCompanyId, {skipPersist:true});
}

// Saves are chained one-after-another so rapid edits never overlap/race.
let _saveChain = Promise.resolve();
function saveDB(){
  SAVE_PENDING = true;
  // DB is the same object reference as the active company's `data`, so it's
  // already in sync — this just makes sure the id lines up before writing.
  const entry = APP.companies.find(c=>c.id===APP.activeCompanyId);
  if(entry) entry.data = DB;
  APP.shared = SHARED;
  const snapshot = JSON.stringify(APP);
  _saveChain = _saveChain.then(async ()=>{
    try{
      const res = await apiFetch('/api/db', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: snapshot
      });
      if(!res.ok) throw new Error('Server responded with ' + res.status);
    }catch(e){
      console.error('save failed', e);
      toast('⚠ Could not save — check your internet connection');
    }finally{
      SAVE_PENDING = false;
    }
  });
  return _saveChain;
}

function persist(){ saveDB(); }

/* =========================================================================
   HELPERS
========================================================================= */
const UNIT_MM = {ft:304.8, in:25.4, cm:10, m:1000, mm:1};
const UNIT_LABEL = {ft:'ft', in:'in', cm:'cm', m:'m', mm:'mm'};

function uid(){ return 'x'+Math.random().toString(36).slice(2,10)+Date.now().toString(36); }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function fmtDate(d){ if(!d) return '—'; const dt=new Date(d+'T00:00:00'); return dt.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}); }
function money(n){ n=Number(n)||0; return '₹'+n.toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function numFmt(n,dec=2){ n=Number(n)||0; return n.toLocaleString('en-IN',{minimumFractionDigits:dec,maximumFractionDigits:dec}); }
function sum(arr,f){ return (arr||[]).reduce((s,x)=>s+(f(x)||0),0); }
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// Renders a scannable QR code (as an inline <svg>) for the given text using
// the bundled qrcode-generator library (public/qrcode.min.js). Used on the
// printed Tax Invoice / e-Way Bill to encode a reference summary of the
// invoice — NOT a government-signed IRP payload (this app has no connection
// to the GST e-Invoice portal; the IRN/Ack No./Ack Date fields are things
// you paste in yourself after generating the e-Invoice on the govt./GSP
// portal). Returns '' if the library isn't available or encoding fails.
function qrSvgFor(text){
  try{
    if(typeof qrcode==='undefined') return '';
    const qr = qrcode(0, 'M');
    qr.addData(text);
    qr.make();
    return qr.createSvgTag({cellSize:4, margin:2, scalable:true});
  }catch(e){
    console.error('QR generation failed:', e);
    return '';
  }
}

function toast(msg){
  const el = document.createElement('div');
  el.className='toast'; el.textContent=msg;
  document.getElementById('toast-root').appendChild(el);
  setTimeout(()=>el.remove(), 2600);
}

function calcCFTCBM(item){
  const Lmm = (parseFloat(item.length)||0) * UNIT_MM[item.lengthUnit];
  const Wmm = (parseFloat(item.width)||0) * UNIT_MM[item.widthUnit];
  const Tmm = (parseFloat(item.thickness)||0) * UNIT_MM[item.thicknessUnit];
  const qty = parseFloat(item.qty)||0;
  const volMM3 = Lmm*Wmm*Tmm*qty;
  const cbm = volMM3/1e9;
  const cft = cbm/0.0283168;
  return {cft: round3(cft), cbm: round3(cbm)};
}
function round3(n){ return Math.round((n+Number.EPSILON)*1000)/1000; }
function round2(n){ return Math.round((n+Number.EPSILON)*100)/100; }
function woodDensity(wood){
  return (DB.settings.density && DB.settings.density[wood]) || null;
}
function kgToCFT(wood, kg){
  const d = woodDensity(wood);
  if(!d) return null;
  return round2((kg/d)*35.3147);
}

// CFT/CBM are now entered manually per row (no more Length x Width x Thickness).
// If only one of the two is typed in, the other is auto-derived from the
// standard conversion factor purely for the amount/print calc — the stored
// field the user left blank stays blank so their own entry is never overwritten.
function effectiveCftCbm(item){
  let cft = parseFloat(item.cft)||0;
  let cbm = parseFloat(item.cbm)||0;
  if(cft && !cbm) cbm = round3(cft*0.0283168);
  if(cbm && !cft) cft = round3(cbm/0.0283168);
  return {cft: round3(cft), cbm: round3(cbm)};
}
function calcItemAmount(item){
  const {cft, cbm} = effectiveCftCbm(item);
  const qty = parseFloat(item.qty)||0;
  const rate = parseFloat(item.rate)||0;
  let amount = 0;
  switch(item.rateType){
    case 'CFT': amount = cft*rate; break;
    case 'CBM': amount = cbm*rate; break;
    case 'PIECE': amount = qty*rate; break;
    case 'CUSTOM': amount = rate; break;
    default: amount = cft*rate;
  }
  return {cft, cbm, amount: round2(amount)};
}

/* Indian number-to-words */
function numToWordsIndian(num){
  num = Math.round(num);
  if(num===0) return 'Zero';
  const ones=['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'];
  const tens=['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
  function two(n){
    if(n<20) return ones[n];
    return tens[Math.floor(n/10)]+(n%10?' '+ones[n%10]:'');
  }
  function three(n){
    let s='';
    if(n>=100){ s+=ones[Math.floor(n/100)]+' Hundred'; n%=100; if(n) s+=' '; }
    if(n) s+=two(n);
    return s;
  }
  let parts=[];
  let crore=Math.floor(num/10000000); num%=10000000;
  let lakh=Math.floor(num/100000); num%=100000;
  let thousand=Math.floor(num/1000); num%=1000;
  let rest=num;
  if(crore) parts.push(three(crore)+' Crore');
  if(lakh) parts.push(three(lakh)+' Lakh');
  if(thousand) parts.push(three(thousand)+' Thousand');
  if(rest) parts.push(three(rest));
  return parts.join(' ');
}
function amountInWords(n){
  const rupees = Math.floor(n);
  const paise = Math.round((n-rupees)*100);
  let s = 'Rupees '+numToWordsIndian(rupees);
  if(paise>0) s += ' and '+numToWordsIndian(paise)+' Paise';
  return s+' Only';
}

/* ---- Tax-invoice print helpers ---- */
const GST_STATE_CODES = {

const RATE_UNIT_LABEL = {CFT:'CFT', CBM:'CBM', PIECE:'PCS', CUSTOM:'Nos'};
function getItemBillQty(item){
  const {cft, cbm} = effectiveCftCbm(item);
  const qty = parseFloat(item.qty)||0;
  let n = 0;
  switch(item.rateType){
    case 'CFT': n = cft; break;
    case 'CBM': n = cbm; break;
    case 'PIECE': n = qty; break;
    case 'CUSTOM': n = 1; break;
    default: n = cft;
  }
  return {qty: round3(n), unit: RATE_UNIT_LABEL[item.rateType]||'Nos'};
}

function nextVoucherNumber(type, dateStr){
  const s = DB.settings;
  const d = dateStr ? new Date(dateStr) : new Date();
  const monKey = d.toLocaleString('en-US',{month:'short'}).toUpperCase();
  const yearKey = d.getFullYear();
  const mk = `${yearKey}-${monKey}`;
  if(typeof s.counters[type] !== 'object' || s.counters[type]===null || Array.isArray(s.counters[type])){
    s.counters[type] = {};
  }
  s.counters[type][mk] = (s.counters[type][mk]||0)+1;
  const prefix = s.prefixes[type];
  return `${prefix}-${monKey}-${String(s.counters[type][mk]).padStart(3,'0')}`;
}

/* ---- Low stock alerts ---- */
function lowStockAlerts(){
  const thresholds = (DB.settings && DB.settings.lowStockThresholds) || {};
  return combinedStockByWood()
    .filter(r=>{
      const t = thresholds[r.wood];
      return t!=null && t!=='' && r.totalCFT < Number(t);
    })
    .map(r=>({wood:r.wood, totalCFT:r.totalCFT, threshold:Number(thresholds[r.wood])}));
}

function maybeCheckLowStock(){
  const alerts = lowStockAlerts();
  if(alerts.length){
    toast(`⚠ ${alerts.length} item${alerts.length>1?'s':''} low on stock — see Dashboard`);
  }
}

/* ---- Simple inline SVG bar chart (no external chart library needed) ---- */
function svgBarChart(data){
  // data: [{label, value}]
  if(!data || !data.length) return `<div class="empty" style="padding:20px 0;">No data yet</div>`;
  const W = 460, H = 200, padL = 44, padB = 36, padT = 12, padR = 12;
  const max = Math.max(1, ...data.map(d=>d.value));
  const barW = (W - padL - padR) / data.length;
  let bars = '';
  let labels = '';
  data.forEach((d,i)=>{
    const h = max>0 ? ((H-padT-padB) * (d.value/max)) : 0;
    const x = padL + i*barW + barW*0.15;
    const y = (H-padB) - h;
    const w = barW*0.7;
    bars += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${w.toFixed(1)}" height="${h.toFixed(1)}" rx="3" fill="var(--copper)"><title>${esc(d.label)}: ${numFmt(d.value,0)}</title></rect>`;
    labels += `<text x="${(x+w/2).toFixed(1)}" y="${H-padB+16}" font-size="10" fill="var(--ink-soft)" text-anchor="middle">${esc(d.label)}</text>`;
  });
  const gridLines = [0,0.5,1].map(f=>{
    const y = padT + (H-padT-padB)*(1-f);
    const val = Math.round(max*f);
    return `<line x1="${padL}" y1="${y.toFixed(1)}" x2="${W-padR}" y2="${y.toFixed(1)}" stroke="var(--line)" stroke-width="1"/><text x="${padL-6}" y="${(y+3).toFixed(1)}" font-size="9" fill="var(--ink-soft)" text-anchor="end">${numFmt(val,0)}</text>`;
  }).join('');
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;">${gridLines}${bars}${labels}</svg>`;
}

function monthlySalesTrend(){
  const months = [];
  const d = new Date();
  d.setDate(1);
  for(let i=5;i>=0;i--){
    const m = new Date(d.getFullYear(), d.getMonth()-i, 1);
    const key = m.toISOString().slice(0,7);
    const label = m.toLocaleString('en-IN',{month:'short'});
    const value = sum(salesVouchers().filter(v=>v.date.slice(0,7)===key && v.status!=='Cancelled'), v=>v.grandTotal);
    months.push({label, value: round2(value)});
  }
  return months;
}

function topCustomersChart(){
  const map = {};
  salesVouchers().filter(v=>v.status!=='Cancelled').forEach(v=>{
    map[v.partyId] = (map[v.partyId]||0) + (v.grandTotal||0);
  });
  return Object.entries(map)
    .sort((a,b)=>b[1]-a[1]).slice(0,5)
    .map(([pid,val])=>{
      const p = getParty(pid);
      const name = p ? p.name : 'Unknown';
      return {label: name.length>10 ? name.slice(0,9)+'…' : name, value: round2(val)};
    });
}

function estimateCOGS(salesVouchersArr){
  let cogs = 0;
  salesVouchersArr.forEach(v=>{
    (v.items||[]).forEach(it=>{
      if(it.lotId){
        const lot = getLot(it.lotId);
        if(lot) cogs += (it.cft||0) * (lot.avgRate||0);
      }
    });
  });
  return cogs;
}

function partyBalance(partyId){
  const p = getParty(partyId);
  if(!p) return 0;
  let bal = parseFloat(p.openingBalance)||0;
  DB.vouchers.forEach(v=>{
    if(v.status==='Cancelled') return;
    if(v.type==='sales' && v.partyId===partyId) bal += v.grandTotal;
    if(v.type==='receipt' && v.partyId===partyId) bal -= v.amount;
    if(v.type==='purchase' && v.partyId===partyId) bal += v.grandTotal; // payable, shown positive too
    if(v.type==='payment' && v.partyId===partyId) bal -= v.amount;
  });
  return round2(bal);
}

async function loadCloudBackupsList(){
  const el = document.getElementById('cloud-backups-list');
  if(!el) return;
  try{
    const res = await apiFetch('/api/backups');
    const list = await res.json();
    if(!res.ok) throw new Error(list.error||'Failed to load');
    if(!list.length){ el.innerHTML = '<p class="page-sub">No snapshots yet — one is created automatically the next time you save.</p>'; return; }
    el.innerHTML = `<div class="tbl-wrap"><table><thead><tr><th>Saved</th><th>By</th><th style="width:120px;"></th></tr></thead><tbody>

async function restoreCloudBackup(id){
  if(!confirm('Restore this snapshot? Your current data will itself be saved as a snapshot first, so nothing is lost.')) return;
  try{
    const res = await apiFetch('/api/backups/'+id+'/restore', {method:'POST'});
    const data = await res.json();
    if(!res.ok) throw new Error(data.error||'Failed');
    toast('✓ Restored — reloading…');
    setTimeout(()=>location.reload(), 900);
  }catch(e){ toast('⚠ '+e.message); }
}

function addSpecies(){

function deleteSpecies(idx){

  if(!confirm(`Remove "${sp}" from the species list? This won't change items already saved with this wood.`)) return;
  DB.settings.species.splice(idx,1);
  if(DB.settings.density) delete DB.settings.density[sp];
  persist(); toast('✓ Species removed'); renderPage();

function setSpeciesDensity(idx, val){
  const sp = DB.settings.species[idx];
  if(!DB.settings.density) DB.settings.density = {};

/* =========================================================================
   BACKUP & RESTORE (real files on the user's PC, not just browser storage)
========================================================================= */
function exportBackup(){
  try{
    // Stock, Khata Book and Manager Ledger are shared across all companies,
    // so fold them into this company's backup file too (not just its own
    // parties/vouchers/settings) — that way a single file is a complete copy.
    const full = {...DB, lots:SHARED.lots, khata:SHARED.khata, managerLedger:SHARED.managerLedger, stockInKG:SHARED.stockInKG};
    const blob = new Blob([JSON.stringify(full, null, 2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `sawmill-backup-${(DB.company.name||'company').replace(/[^a-z0-9]+/gi,'-').toLowerCase()}-${todayISO()}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 1000);
    localStorage.setItem(BACKUP_KEY, todayISO());
    toast('✓ Backup downloaded — save it somewhere safe');
  }catch(e){
    console.error('backup failed', e);
    toast('⚠ Could not create backup');
  }
}

function importBackup(inputEl){
  const file = inputEl.files && inputEl.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (e)=>{
    let parsed;
    try{
      parsed = JSON.parse(e.target.result);
    }catch(err){
      toast('⚠ That file isn\'t valid — could not read it');
      inputEl.value = '';
      return;
    }
    if(!parsed || !Array.isArray(parsed.parties) || !Array.isArray(parsed.vouchers)){
      toast('⚠ That doesn\'t look like a Sawmill backup file');
      inputEl.value = '';
      return;
    }
    if(!confirm(`This will REPLACE all data for "${DB.company.name||'this company'}" (parties, invoices, settings) with this backup file. Stock, Khata Book and Manager Ledger are shared across every company, so restoring them from this file will replace those for ALL your companies, not just this one. This cannot be undone. Continue?`)){
      inputEl.value = '';
      return;
    }
    // Pull the shared parts (if this backup has them) out before the rest
    // of `parsed` gets treated as this one company's private data.
    const restoredShared = {
      lots: Array.isArray(parsed.lots) ? parsed.lots : null,
      khata: Array.isArray(parsed.khata) ? parsed.khata : null,
      managerLedger: Array.isArray(parsed.managerLedger) ? parsed.managerLedger : null,
      stockInKG: Array.isArray(parsed.stockInKG) ? parsed.stockInKG : null
    };
    DB = parsed;
    if(!DB.vouchers) DB = defaultDB();
    if(!DB.settings.species) DB.settings.species = defaultDB().settings.species;
    if(!DB.settings.density) DB.settings.density = defaultDB().settings.density;
    ensureDataDefaults(DB);
    delete DB.lots; delete DB.khata; delete DB.managerLedger; delete DB.stockInKG;
    if(restoredShared.lots) SHARED.lots = restoredShared.lots;
    if(restoredShared.khata) SHARED.khata = restoredShared.khata;
    if(restoredShared.managerLedger) SHARED.managerLedger = restoredShared.managerLedger;
    if(restoredShared.stockInKG) SHARED.stockInKG = restoredShared.stockInKG;
    {
      const entry = APP.companies.find(c=>c.id===APP.activeCompanyId);
      if(entry) entry.data = DB;
    }
    persist();
    toast('✓ Backup restored');
    inputEl.value = '';
    renderNav();
    renderPage();
  };
  reader.onerror = ()=>{ toast('⚠ Could not read that file'); };
  reader.readAsText(file);
}

function computeTotals(){
  let subtotal=0, totalCFT=0, totalCBM=0, totalPieces=0, totalTax=0;
  const partyId = document.getElementById('vf_party')?document.getElementById('vf_party').value:null;
  const party = partyId?getParty(partyId):null;
  // GST type is a manual selector (CGST+SGST vs IGST) that defaults to the
  // auto-detected state comparison but can be overridden by the user.
  const gstTypeEl = document.getElementById('vf_gsttype');
  const gstType = gstTypeEl ? gstTypeEl.value : (isInterstate(party) ? 'IGST' : 'CGST_SGST');
  const interstate = gstType === 'IGST';
  FORM_ITEMS.forEach(it=>{
    const {cft,cbm,amount} = calcItemAmount(it);
    subtotal += amount; totalCFT+=cft; totalCBM+=cbm; totalPieces+=parseFloat(it.qty)||0;
  });
  // Bill Short is NOT part of the official invoice math anymore — it's kept
  // purely as a personal/internal note (see vf_personalshort) and never
  // touches the taxable amount, tax, or grand total.
  const discount = parseFloat(document.getElementById('ch_discount2')?.value)||0;
  const freight = parseFloat(document.getElementById('ch_freight')?.value)||0;
  const transport = parseFloat(document.getElementById('ch_transport')?.value)||0;
  const loading = parseFloat(document.getElementById('ch_loading')?.value)||0;
  const unloading = parseFloat(document.getElementById('ch_unloading')?.value)||0;
  const cutting = parseFloat(document.getElementById('ch_cutting')?.value)||0;
  const labour = parseFloat(document.getElementById('ch_labour')?.value)||0;
  const other = parseFloat(document.getElementById('ch_other')?.value)||0;

  const discounted = Math.max(subtotal-discount,0);
  const ratio = subtotal>0 ? discounted/subtotal : 0;
  FORM_ITEMS.forEach(it=>{
    const {amount} = calcItemAmount(it);
    totalTax += amount*((parseFloat(it.gstRate)||0)/100)*ratio;
  });
  totalTax = round2(totalTax);
  let cgst=0,sgst=0,igst=0;
  if(interstate){ igst=totalTax; } else { cgst=round2(totalTax/2); sgst=round2(totalTax-cgst); }

  const charges = freight+transport+loading+unloading+cutting+labour+other;
  const rawGrand = discounted+totalTax+charges;
  const grandTotal = Math.round(rawGrand);
  const roundOff = round2(grandTotal-rawGrand);

  return {subtotal:round2(subtotal), totalCFT:round3(totalCFT), totalCBM:round3(totalCBM), totalPieces,
    discount, charges:{freight,transport,loading,unloading,cutting,labour,other}, taxableAmount:round2(discounted),
    cgst,sgst,igst,totalTax,roundOff,grandTotal, interstate, gstType};
}

function updateTotalsBox(){
  const t = computeTotals();
  const summary = document.getElementById('totals-summary');
  if(!summary) return;
  const paidVal = document.getElementById('vf_paid') ? parseFloat(document.getElementById('vf_paid').value)||0 : 0;
  // Only the taxable total, the selected GST split, and the grand total are
  // shown here — no Bill Short, discount/charges breakdown, or piece/CFT/CBM
  // counts, per how the bill should read.
  summary.innerHTML = `
    <div class="trow"><span>Taxable Amount</span><span class="mono">${money(t.taxableAmount)}</span></div>
    ${t.interstate?`<div class="trow"><span>IGST</span><span class="mono">${money(t.igst)}</span></div>`
      :`<div class="trow"><span>CGST</span><span class="mono">${money(t.cgst)}</span></div><div class="trow"><span>SGST</span><span class="mono">${money(t.sgst)}</span></div>`}
    <div class="trow grand"><span>Grand Total</span><span class="mono">${money(t.grandTotal)}</span></div>
  `;
  // Paid Now input and Balance live outside this rebuilt block on purpose —
  // rebuilding them on every keystroke used to kick focus out of the field.
  const balEl = document.getElementById('vf_balance');
  if(balEl) balEl.textContent = money(t.grandTotal-paidVal);
}

function saveSalesInvoice(existingId){
  const partyId = v('vf_party');
  if(!partyId){ toast('Select a customer'); return; }
  if(!FORM_ITEMS.length || FORM_ITEMS.every(it=>!it.wood)){ toast('Add at least one timber item'); return; }

  // reverse old stock/ledger effect if editing
  if(existingId){ reverseVoucherEffects(existingId); }

  const t = computeTotals();
  const paid = parseFloat(document.getElementById('vf_paid')?.value)||0;
  const balance = round2(t.grandTotal-paid);
  let status = balance<=0.001 ? 'Paid' : (paid>0 ? 'Partially Paid' : 'Unpaid');
  const dueDate = v('vf_due');
  if(status!=='Paid' && dueDate && dueDate < todayISO()) status='Overdue';

  const items = FORM_ITEMS.map(it=>{ const {cft,cbm,amount}=calcItemAmount(it); return {...it, cft, cbm, amount}; });

  const voucher = {
    id: existingId || uid(),
    type:'sales',
    number: existingId ? DB.vouchers.find(x=>x.id===existingId).number : nextVoucherNumber('sales', v('vf_date')||todayISO()),
    date: v('vf_date')||todayISO(),
    dueDate,
    partyId,
    vehicleNumber:v('vf_vehicle'), transporter:v('vf_transporter'), ewayBill:v('vf_eway'), refNumber:v('vf_ref'), terms:v('vf_terms'),
    deliveryNote:v('vf_deliverynote'), otherReference:v('vf_otherref'),
    despatchDocNo:v('vf_despatchdoc'), deliveryNoteDate:v('vf_deliverydate'),
    lrNo:v('vf_lrno'), lrDate:v('vf_lrdate'), termsOfDelivery:v('vf_termsdelivery'),
    irn:v('vf_irn'), ackNo:v('vf_ackno'), ackDate:v('vf_ackdate'),
    ewayDistanceKm:v('vf_ewaydist'), ewayGeneratedDate:v('vf_ewaygendate'), ewayValidUpto:v('vf_ewayvalid'),
    ewayMode:v('vf_ewaymode'), ewaySupplyType:v('vf_ewaysupply'), ewayTransactionType:v('vf_ewaytxn'),
    transporterId:v('vf_transporterid'), transporterDocNo:v('vf_transporterdoc'),
    buyerOverride: document.getElementById('vf_billdiff')?.checked ? {
      name:v('vf_buyername'), gstin:v('vf_buyergstin'), state:v('vf_buyerstate'), address:v('vf_buyeraddress')
    } : null,
    items,
    charges: t.charges, discount: t.discount, gstType: t.gstType,
    subtotal: t.subtotal, taxableAmount: t.taxableAmount, cgst:t.cgst, sgst:t.sgst, igst:t.igst,
    roundOff:t.roundOff, grandTotal:t.grandTotal, paid, balance, status,
    personalShort: parseFloat(document.getElementById('vf_personalshort')?.value)||0,
    personalNote: v('vf_personalnote')||'',
    createdAt: existingId ? DB.vouchers.find(x=>x.id===existingId).createdAt : new Date().toISOString()
  };

  // apply stock effect: reduce lot stock
  items.forEach(it=>{ if(it.lotId){ const lot=getLot(it.lotId); if(lot) lot.soldCFT = round3(lot.soldCFT + it.cft); } });

  if(existingId){
    const i = DB.vouchers.findIndex(x=>x.id===existingId);
    DB.vouchers[i]=voucher;
  }else{
    DB.vouchers.push(voucher);
  }
  persist(); closeModal(); toast(`✓ Invoice ${voucher.number} saved`); go('sales');
}

function reverseVoucherEffects(id){
  const old = DB.vouchers.find(x=>x.id===id);
  if(!old) return;
  if(old.type==='sales'){
    (old.items||[]).forEach(it=>{ if(it.lotId){ const lot=getLot(it.lotId); if(lot) lot.soldCFT = round3(lot.soldCFT - it.cft); } });
  }
  if(old.type==='purchase'){
    (old.items||[]).forEach(it=>{ if(it.lotId){ const lot=getLot(it.lotId); if(lot) lot.purchasedCFT = round3(lot.purchasedCFT - it.cft); } });
  }
}

function deleteVoucher(id){
  const vch = DB.vouchers.find(x=>x.id===id);
  if(!vch) return;
  const kindLabel = {sales:'sales invoice',purchase:'purchase bill',receipt:'receipt',payment:'payment'}[vch.type]||'record';
  if(!confirm(`Move ${kindLabel} ${vch.number} to Trash? This will reverse its effect on stock and party balances (restoring it later will re-apply them).`)) return;

  if(vch.type==='sales' || vch.type==='purchase'){
    reverseVoucherEffects(id);
  }
  if(vch.type==='receipt' && vch.againstInvoiceId){
    const inv = DB.vouchers.find(x=>x.id===vch.againstInvoiceId);
    if(inv){
      inv.paid = round2(inv.paid - vch.amount);
      inv.balance = round2(inv.grandTotal - inv.paid);
      inv.status = inv.balance<=0.001 ? 'Paid' : (inv.paid>0 ? 'Partially Paid' : 'Unpaid');
    }
  }

  softDeleteToTrash('voucher', vch, `${vch.number} (${kindLabel})`);
  DB.vouchers = DB.vouchers.filter(x=>x.id!==id);
  persist(); toast(`✓ ${kindLabel[0].toUpperCase()+kindLabel.slice(1)} moved to Trash`); renderPage();
}

/* =========================================================================
   TRASH / RECYCLE BIN — soft-deleted parties, lots and vouchers land here
   instead of being wiped, so an accidental delete can be undone. Each entry
   carries a snapshot of the record at the moment it was deleted.
========================================================================= */
function softDeleteToTrash(kind, obj, label){
  if(!DB.trash) DB.trash = [];
  DB.trash.push({
    id: uid(),
    kind,               // 'party' | 'lot' | 'voucher'
    label: label || '',
    data: JSON.parse(JSON.stringify(obj)),
    deletedAt: new Date().toISOString()
  });
  // Keep trash from growing forever — 200 most recent deletions.
  if(DB.trash.length > 200) DB.trash = DB.trash.slice(DB.trash.length - 200);
}

function reapplyVoucherEffects(vch){
  if(vch.type==='sales'){
    (vch.items||[]).forEach(it=>{ if(it.lotId){ const lot=getLot(it.lotId); if(lot) lot.soldCFT = round3(lot.soldCFT + it.cft); } });
  }
  if(vch.type==='purchase'){
    (vch.items||[]).forEach(it=>{ if(it.lotId){ const lot=getLot(it.lotId); if(lot){
      const oldTotalCost = lot.avgRate*lot.purchasedCFT;
      const newPurchased = round3(lot.purchasedCFT + it.cft);
      lot.avgRate = newPurchased>0 ? round2((oldTotalCost+it.amount)/newPurchased) : 0;
      lot.purchasedCFT = newPurchased;
    }}});
  }
  if(vch.type==='receipt' && vch.againstInvoiceId){
    const inv = DB.vouchers.find(x=>x.id===vch.againstInvoiceId);
    if(inv){
      inv.paid = round2(inv.paid + vch.amount);
      inv.balance = round2(inv.grandTotal - inv.paid);
      inv.status = inv.balance<=0.001 ? 'Paid' : (inv.paid>0 ? 'Partially Paid' : 'Unpaid');
    }
  }
}

function restoreTrashItem(trashId){
  const entry = (DB.trash||[]).find(t=>t.id===trashId);
  if(!entry) return;
  if(entry.kind==='party'){
    if(!DB.parties.some(p=>p.id===entry.data.id)) DB.parties.push(entry.data);
  } else if(entry.kind==='lot'){
    if(!SHARED.lots.some(l=>l.id===entry.data.id)) SHARED.lots.push(entry.data);
  } else if(entry.kind==='voucher'){
    if(!DB.vouchers.some(v=>v.id===entry.data.id)){
      DB.vouchers.push(entry.data);
      reapplyVoucherEffects(entry.data);
    }
  }
  DB.trash = DB.trash.filter(t=>t.id!==trashId);
  persist(); toast('✓ Restored'); renderPage();
}

function deleteForeverTrashItem(trashId){
  if(!confirm('Permanently delete this? It cannot be recovered after this.')) return;
  DB.trash = (DB.trash||[]).filter(t=>t.id!==trashId);
  persist(); toast('Permanently deleted'); renderPage();
}

function emptyTrash(){
  if(!DB.trash || !DB.trash.length){ toast('Trash is already empty'); return; }
  if(!confirm(`Permanently delete all ${DB.trash.length} item(s) in Trash? This cannot be undone.`)) return;
  DB.trash = [];
  persist(); toast('Trash emptied'); renderPage();
}

function savePurchaseBill(existingId){
  const partyId = v('vf_party');
  if(!partyId){ toast('Select a supplier'); return; }
  if(!FORM_ITEMS.length || FORM_ITEMS.every(it=>!it.wood)){ toast('Add at least one timber item'); return; }

  if(existingId){ reverseVoucherEffects(existingId); }

  const t = computeTotals();
  const paid = parseFloat(document.getElementById('vf_paid')?.value)||0;
  const balance = round2(t.grandTotal-paid);
  const status = balance<=0.001 ? 'Paid' : (paid>0 ? 'Partially Paid' : 'Unpaid');

  const items = FORM_ITEMS.map(it=>{
    const {cft,cbm,amount}=calcItemAmount(it);
    let lotId = it.lotId;
    if(!lotId && it.wood){
      // auto-create lot
      const lotNo = 'LOT-'+String(SHARED.lots.length+1).padStart(3,'0');
      const newLot = {id:uid(), lotNo, wood:it.wood, species:it.species||'', warehouse:'Main', purchasedCFT:0, soldCFT:0, avgRate:0};
      SHARED.lots.push(newLot);
      lotId = newLot.id;
    }
    return {...it, cft, cbm, amount, lotId};
  });

  const voucher = {
    id: existingId || uid(),
    type:'purchase',
    number: existingId ? DB.vouchers.find(x=>x.id===existingId).number : nextVoucherNumber('purchase', v('vf_date')||todayISO()),
    date: v('vf_date')||todayISO(),
    partyId,
    vehicleNumber:v('vf_vehicle'), refNumber:v('vf_ref'), boughtVia:v('vf_boughtvia'),
    items,
    charges: t.charges, discount: t.discount, gstType: t.gstType,
    subtotal: t.subtotal, taxableAmount: t.taxableAmount, cgst:t.cgst, sgst:t.sgst, igst:t.igst,
    roundOff:t.roundOff, grandTotal:t.grandTotal, paid, balance, status,
    personalShort: parseFloat(document.getElementById('vf_personalshort')?.value)||0,
    personalNote: v('vf_personalnote')||'',
    createdAt: existingId ? DB.vouchers.find(x=>x.id===existingId).createdAt : new Date().toISOString()
  };

  items.forEach(it=>{
    if(it.lotId){
      const lot = getLot(it.lotId);
      if(lot){
        const oldTotalCost = lot.avgRate*lot.purchasedCFT;
        const newCost = it.amount;
        const newPurchased = round3(lot.purchasedCFT + it.cft);
        lot.avgRate = newPurchased>0 ? round2((oldTotalCost+newCost)/newPurchased) : 0;
        lot.purchasedCFT = newPurchased;
      }
    }
  });

  if(existingId){
    const i = DB.vouchers.findIndex(x=>x.id===existingId);
    DB.vouchers[i]=voucher;
  }else{
    DB.vouchers.push(voucher);
  }
  persist(); closeModal(); toast(`✓ Purchase ${voucher.number} saved`); go('purchase');
}

function saveReceipt(existingId){
  const partyId=v('rf_party'); const amount=parseFloat(v('rf_amount'))||0;
  if(!partyId || amount<=0){ toast('Select customer and amount'); return; }
  if(existingId){
    // reverse the old receipt's effect on its linked invoice before re-applying
    const old = DB.vouchers.find(x=>x.id===existingId);
    if(old && old.againstInvoiceId){
      const inv = DB.vouchers.find(x=>x.id===old.againstInvoiceId);
      if(inv){ inv.paid=round2(inv.paid-old.amount); inv.balance=round2(inv.grandTotal-inv.paid); inv.status = inv.balance<=0.001?'Paid':(inv.paid>0?'Partially Paid':'Unpaid'); }
    }
  }
  const voucher = {id: existingId||uid(), type:'receipt', number: existingId?DB.vouchers.find(x=>x.id===existingId).number:nextVoucherNumber('receipt', v('rf_date')||todayISO()), date:v('rf_date')||todayISO(),
    partyId, amount, mode:v('rf_mode'), notes:v('rf_notes'), againstInvoiceId: v('rf_against')||null, createdAt: existingId?DB.vouchers.find(x=>x.id===existingId).createdAt:new Date().toISOString()};
  if(existingId){
    const i = DB.vouchers.findIndex(x=>x.id===existingId);
    DB.vouchers[i]=voucher;
  }else{
    DB.vouchers.push(voucher);
  }
  if(voucher.againstInvoiceId){
    const inv = DB.vouchers.find(x=>x.id===voucher.againstInvoiceId);
    if(inv){ inv.paid=round2(inv.paid+amount); inv.balance=round2(inv.grandTotal-inv.paid); inv.status = inv.balance<=0.001?'Paid':(inv.paid>0?'Partially Paid':'Unpaid'); }
  }
  persist(); closeModal(); toast(`✓ Receipt ${voucher.number} saved`); go('receipts');
}

function combinedStockByWood(){
  const map = {};
  (SHARED.lots||[]).forEach(l=>{
    if(!map[l.wood]) map[l.wood]={wood:l.wood, cftLots:0, kgStock:0};
    map[l.wood].cftLots = round3(map[l.wood].cftLots + (l.purchasedCFT-l.soldCFT));
  });
  (SHARED.stockInKG||[]).forEach(e=>{
    if(!map[e.wood]) map[e.wood]={wood:e.wood, cftLots:0, kgStock:0};
    map[e.wood].kgStock = round3(map[e.wood].kgStock + e.qty);
  });
  return Object.values(map).map(r=>{
    const convCFT = kgToCFT(r.wood, r.kgStock);
    return {...r, convCFT, totalCFT: round2(r.cftLots + (convCFT||0))};
  }).sort((a,b)=>a.wood.localeCompare(b.wood));
}

/* =========================================================================
   EXCEL-BASED STOCK IMPORT — user uploads their own .xlsx/.xls/.csv sheet,
   we let them map whichever columns it has onto our lot fields, preview
   the first few rows, then bulk-create/update lots. Parsed locally in the
   browser via the vendored SheetJS (xlsx.full.min.js) — the file itself is
   never uploaded anywhere.
========================================================================= */
let IMPORT_ROWS = [];   // raw rows from the sheet (array of arrays), row 0 = header
let IMPORT_HEADERS = [];
const LOT_IMPORT_FIELDS = [
  {key:'lotNo', label:'Lot No.', required:false},
  {key:'wood', label:'Wood / Species', required:true},
  {key:'warehouse', label:'Warehouse', required:false},
  {key:'purchasedCFT', label:'Purchased CFT (Qty in stock)', required:true},
  {key:'soldCFT', label:'Sold CFT', required:false},
  {key:'avgRate', label:'Avg Cost ₹ / CFT', required:false}
];
function openExcelImportModal(){
  const html = `
  <div class="modal-bg" onclick="if(event.target===this)closeModal()">
    <div class="modal wide">
      <div class="modal-head"><h3>Import Stock from Excel</h3><button class="close-x" onclick="closeModal()">✕</button></div>
      <p class="page-sub">Upload your existing stock sheet (.xlsx, .xls, or .csv) — any layout is fine, you'll match its columns to the right fields on the next step.</p>
      <input type="file" id="excel-import-file" accept=".xlsx,.xls,.csv" onchange="handleExcelFile(this)">
      <div id="excel-import-body" style="margin-top:14px;"></div>
    </div>
  </div>`;
  document.getElementById('modal-root').innerHTML = html;
}
function handleExcelFile(input){
  const file = input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (e)=>{
    try{
      const data = new Uint8Array(e.target.result);
      const wb = XLSX.read(data, {type:'array'});
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(sheet, {header:1, raw:true, defval:''});
      if(!rows.length){ toast('⚠ That sheet looks empty'); return; }
      IMPORT_HEADERS = rows[0].map(h=>String(h||'').trim());
      IMPORT_ROWS = rows.slice(1).filter(r=>r.some(c=>String(c||'').trim()!==''));
      renderExcelMappingUI();
    }catch(err){
      toast('⚠ Could not read that file — is it a valid Excel/CSV file?');
    }
  };
  reader.onerror = ()=>toast('⚠ Could not read that file');
  reader.readAsArrayBuffer(file);
}
function renderExcelMappingUI(){
  const body = document.getElementById('excel-import-body');
  if(!body) return;
  const colOpts = (selectedKey)=>{
    let opts = `<option value="">— not in sheet —</option>`;
    IMPORT_HEADERS.forEach((h,i)=>{
      opts += `<option value="${i}">${esc(h||('Column '+(i+1)))}</option>`;
    });
    return opts;
  };
  // best-effort auto-guess mapping by header name
  const guess = (key)=>{
    const aliases = {
      lotNo:['lot','lot no','lotno','lot number'],
      wood:['wood','species','item','timber','material'],
      warehouse:['warehouse','godown','location'],
      purchasedCFT:['purchased','purchased cft','qty','quantity','stock','cft','balance cft'],
      soldCFT:['sold','sold cft'],
      avgRate:['rate','avg rate','avg cost','cost','price','rate per cft']
    };
    const idx = IMPORT_HEADERS.findIndex(h=>aliases[key].includes(String(h||'').trim().toLowerCase()));
    return idx>=0?idx:'';
  };
  body.innerHTML = `
    <h4 class="slab" style="margin:6px 0;">Match Your Columns</h4>
    <div class="grid g2">
      ${LOT_IMPORT_FIELDS.map(f=>`
        <div class="field">
          <label>${f.label}${f.required?' *':''}</label>
          <select id="map_${f.key}">${colOpts()}</select>
        </div>`).join('')}
    </div>
    <h4 class="slab" style="margin:14px 0 6px;">Preview (first 5 rows)</h4>
    <div class="tbl-wrap"><table>
      <thead><tr>${IMPORT_HEADERS.map(h=>`<th>${esc(h||'—')}</th>`).join('')}</tr></thead>
      <tbody>${IMPORT_ROWS.slice(0,5).map(r=>`<tr>${IMPORT_HEADERS.map((h,i)=>`<td>${esc(String(r[i]!==undefined?r[i]:''))}</td>`).join('')}</tr>`).join('')}</tbody>
    </table></div>
    <p class="page-sub" style="margin-top:8px;">${IMPORT_ROWS.length} row(s) found in the sheet.</p>
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:10px;">
      <button class="btn" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="runExcelImport()">Import ${IMPORT_ROWS.length} Row(s)</button>
    </div>`;
  // apply auto-guessed mapping
  LOT_IMPORT_FIELDS.forEach(f=>{
    const sel = document.getElementById('map_'+f.key);
    const g = guess(f.key);
    if(sel && g!=='') sel.value = String(g);
  });
}
function runExcelImport(){
  const mapping = {};
  LOT_IMPORT_FIELDS.forEach(f=>{
    const sel = document.getElementById('map_'+f.key);
    mapping[f.key] = sel && sel.value!=='' ? parseInt(sel.value) : null;
  });
  if(mapping.wood===null || mapping.purchasedCFT===null){
    toast('⚠ Please map at least Wood/Species and Purchased CFT'); return;
  }
  let created = 0, skipped = 0;
  IMPORT_ROWS.forEach(r=>{
    const wood = mapping.wood!==null ? String(r[mapping.wood]||'').trim() : '';
    if(!wood){ skipped++; return; }
    const purchasedCFT = mapping.purchasedCFT!==null ? parseFloat(r[mapping.purchasedCFT])||0 : 0;
    const lotNo = mapping.lotNo!==null && r[mapping.lotNo] ? String(r[mapping.lotNo]).trim() : ('LOT-'+String(SHARED.lots.length+1).padStart(3,'0'));
    const warehouse = mapping.warehouse!==null && r[mapping.warehouse] ? String(r[mapping.warehouse]).trim() : 'Main';
    const soldCFT = mapping.soldCFT!==null ? parseFloat(r[mapping.soldCFT])||0 : 0;
    const avgRate = mapping.avgRate!==null ? parseFloat(r[mapping.avgRate])||0 : 0;
    SHARED.lots.push({id:uid(), lotNo, wood, warehouse, purchasedCFT, soldCFT, avgRate});
    created++;
  });
  persist(); closeModal();
  toast(`✓ Imported ${created} lot(s)${skipped?` — skipped ${skipped} row(s) with no wood/species`:''}`);
  renderPage();
}

/* =========================================================================
   STOCK BY SIZE — groups every purchased/sold timber row by wood
   + exact dimensions, so you can see how many pieces/CFT of each size
   are left in stock (not just a lump total per lot).
========================================================================= */
function sizeKey(it){
  return [
    (it.wood||'').trim().toLowerCase(),
    parseFloat(it.length)||0, it.lengthUnit||'ft',
    parseFloat(it.width)||0, it.widthUnit||'in',
    parseFloat(it.thickness)||0, it.thicknessUnit||'in'
  ].join('|');
}
function dimsLabel(it){
  const L = `${it.length||0}${it.lengthUnit||'ft'}`;
  const W = `${it.width||0}${it.widthUnit||'in'}`;
  const T = `${it.thickness||0}${it.thicknessUnit||'in'}`;
  return `${L} × ${W} × ${T}`;
}
function computeStockBySize(){
  const map = {};
  purchaseVouchers().filter(v=>v.status!=='Cancelled').forEach(v=>{
    (v.items||[]).forEach(it=>{
      if(!it.wood) return;
      const k = sizeKey(it);
      if(!map[k]) map[k] = {wood:it.wood, dims:dimsLabel(it), pieces:0, cft:0, purchasedCft:0, soldCft:0};
      map[k].pieces += parseFloat(it.qty)||0;
      map[k].cft += it.cft||0;
      map[k].purchasedCft += it.cft||0;
    });
  });
  salesVouchers().filter(v=>v.status!=='Cancelled').forEach(v=>{
    (v.items||[]).forEach(it=>{
      if(!it.wood) return;
      const k = sizeKey(it);
      if(!map[k]) map[k] = {wood:it.wood, dims:dimsLabel(it), pieces:0, cft:0, purchasedCft:0, soldCft:0};
      map[k].pieces -= parseFloat(it.qty)||0;
      map[k].cft -= it.cft||0;
      map[k].soldCft += it.cft||0;
    });
  });
  return Object.values(map).sort((a,b)=> a.wood.localeCompare(b.wood) || a.dims.localeCompare(b.dims));
}
function renderStockBySizePage(){
  const rows = computeStockBySize();
  const totalCft = rows.reduce((s,r)=>s+r.cft,0);
  return `
  <div class="page-head"><div><div class="page-title">Stock by Size</div><div class="page-sub">${rows.length} size groups · ${numFmt(totalCft,2)} CFT on hand — built from every Wood + Length × Width × Thickness on your purchase &amp; sales rows</div></div></div>
  <div class="card" style="padding:0;">
  <div class="tbl-wrap" style="border:none;"><table>
    <thead><tr><th>Wood</th><th>Size (L × W × T)</th><th class="num">Pieces in Stock</th><th class="num">Purchased CFT</th><th class="num">Sold CFT</th><th class="num">Balance CFT</th></tr></thead>
    <tbody>
    ${rows.length?rows.map(r=>`
      <tr>
        <td style="font-weight:600;">${esc(r.wood)}</td>
        <td class="mono">${esc(r.dims)}</td>
        <td class="num mono" style="${r.pieces<0?'color:var(--rust);':''}">${numFmt(r.pieces,0)}</td>
        <td class="num mono">${numFmt(r.purchasedCft,3)}</td>
        <td class="num mono">${numFmt(r.soldCft,3)}</td>
        <td class="num mono" style="font-weight:700;${r.cft<0?'color:var(--rust);':''}">${numFmt(r.cft,3)}</td>
      </tr>`).join(''):'<tr><td colspan="6" class="empty">No stock yet — add a Purchase Bill with timber sizes.</td></tr>'}
    </tbody>
  </table></div></div>
  <p class="page-sub">Negative balances mean more of that exact size was sold than purchased — double-check the item rows on those invoices.</p>
  `;
}
